<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="슬라임 머지 디펜스">
  <!-- 배경: 잔디 체크무늬 (게임 타이틀 화면과 동일한 톤) -->
  <defs>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="96" ry="96"/>
    </clipPath>
    <radialGradient id="slimeBody" cx="38%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#c9ff7a"/>
      <stop offset="55%" stop-color="#8fd14f"/>
      <stop offset="100%" stop-color="#5f9c2e"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#round)">
    <rect x="0" y="0" width="512" height="512" fill="#a8cc3e"/>
    <g fill="rgba(255,255,255,0.09)">
      <rect x="0"   y="0"   width="64" height="64"/><rect x="128" y="0"   width="64" height="64"/>
      <rect x="256" y="0"   width="64" height="64"/><rect x="384" y="0"   width="64" height="64"/>
      <rect x="64"  y="64"  width="64" height="64"/><rect x="192" y="64"  width="64" height="64"/>
      <rect x="320" y="64"  width="64" height="64"/><rect x="448" y="64"  width="64" height="64"/>
      <rect x="0"   y="128" width="64" height="64"/><rect x="128" y="128" width="64" height="64"/>
      <rect x="256" y="128" width="64" height="64"/><rect x="384" y="128" width="64" height="64"/>
      <rect x="64"  y="192" width="64" height="64"/><rect x="192" y="192" width="64" height="64"/>
      <rect x="320" y="192" width="64" height="64"/><rect x="448" y="192" width="64" height="64"/>
      <rect x="0"   y="256" width="64" height="64"/><rect x="128" y="256" width="64" height="64"/>
      <rect x="256" y="256" width="64" height="64"/><rect x="384" y="256" width="64" height="64"/>
      <rect x="64"  y="320" width="64" height="64"/><rect x="192" y="320" width="64" height="64"/>
      <rect x="320" y="320" width="64" height="64"/><rect x="448" y="320" width="64" height="64"/>
      <rect x="0"   y="384" width="64" height="64"/><rect x="128" y="384" width="64" height="64"/>
      <rect x="256" y="384" width="64" height="64"/><rect x="384" y="384" width="64" height="64"/>
      <rect x="64"  y="448" width="64" height="64"/><rect x="192" y="448" width="64" height="64"/>
      <rect x="320" y="448" width="64" height="64"/><rect x="448" y="448" width="64" height="64"/>
    </g>

    <!-- 그림자 -->
    <ellipse cx="256" cy="418" rx="148" ry="26" fill="rgba(40,60,15,0.28)"/>

    <!-- 슬라임 몸통 (아래가 넓게 퍼진 물방울 형태) -->
    <path d="M256 92
             C 330 92 396 176 404 268
             C 410 340 356 400 256 400
             C 156 400 102 340 108 268
             C 116 176 182 92 256 92 Z"
          fill="url(#slimeBody)" stroke="#3f6b1c" stroke-width="14" stroke-linejoin="round"/>

    <!-- 하이라이트 -->
    <ellipse cx="197" cy="180" rx="42" ry="30" fill="rgba(255,255,255,0.55)" transform="rotate(-24 197 180)"/>

    <!-- 눈 -->
    <ellipse cx="212" cy="258" rx="21" ry="26" fill="#243a10"/>
    <ellipse cx="302" cy="258" rx="21" ry="26" fill="#243a10"/>
    <circle cx="219" cy="249" r="7.5" fill="#ffffff"/>
    <circle cx="309" cy="249" r="7.5" fill="#ffffff"/>

    <!-- 볼터치 -->
    <ellipse cx="168" cy="300" rx="24" ry="14" fill="rgba(255,120,150,0.42)"/>
    <ellipse cx="346" cy="300" rx="24" ry="14" fill="rgba(255,120,150,0.42)"/>

    <!-- 입 -->
    <path d="M232 312 Q256 338 280 312" fill="none" stroke="#243a10" stroke-width="12" stroke-linecap="round"/>

    <!-- 머리 위 꽃 (게임 내 슬라임 장식) -->
    <g transform="translate(256 84)">
      <circle cx="0"   cy="-22" r="17" fill="#ffb7d5"/>
      <circle cx="21"  cy="-7"  r="17" fill="#ffb7d5"/>
      <circle cx="13"  cy="18"  r="17" fill="#ffb7d5"/>
      <circle cx="-13" cy="18"  r="17" fill="#ffb7d5"/>
      <circle cx="-21" cy="-7"  r="17" fill="#ffb7d5"/>
      <circle cx="0"   cy="0"   r="13" fill="#ffd93d"/>
    </g>

    <!-- 머지 배지: 합성을 상징하는 + 기호 -->
    <g transform="translate(404 404)">
      <circle cx="0" cy="0" r="64" fill="#ffd93d" stroke="#8a6a10" stroke-width="10"/>
      <path d="M-32 0 H32 M0 -32 V32" stroke="#5c4708" stroke-width="18" stroke-linecap="round"/>
    </g>
  </g>
</svg>
