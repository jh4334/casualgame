function cellCenter(idx) {
  const c = idx % COLS, r = Math.floor(idx / COLS);
  return { x: c * CELL + CELL / 2, y: GRID_TOP + r * (CELL - 8) + (CELL - 8) / 2 };
}

// ---------- 업데이트 ----------
function update(dt) {
  time += dt;
  // 🃏 카드 선택 중: 전투/타이머는 모두 정지, 선택 연출만 진행
  if (state === "card") {
    if (cardPick && cardPick.sel >= 0) {
      cardPick.selT -= dt;
      if (cardPick.selT <= 0) applyCardPick();
    }
    return;
  }
  if (state !== "play") return;

  // 웨이브 진행
  if (!waveActive) {
    waveDelay -= dt;
    if (waveDelay <= 0) startWave();
  } else {
    if (spawnQueue > 0) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnEnemy();
        spawnQueue--;
        spawnTimer = Math.max(0.3, 1.3 - wave * 0.05) * (0.7 + Math.random() * 0.6);
      }
    } else if (enemies.length === 0) {
      waveActive = false;
      waveDelay = 3; // 합성할 여유 시간

      // 🌊 러시아워는 클리어 보너스 3배
      const bonus = Math.floor((30 + wave * 18) * goldMult() * (waveEvent === "rush" ? 3 : 1));
      gold += bonus;
      floatText(W / 2, H / 2 - 80, "웨이브 클리어! +" + bonus + "💰", "#ffd93d", 24, 1.5);
      waveEvent = null;   // 🎪 이벤트 상태는 웨이브 종료 시 확실히 해제
      // 🃏 5웨이브마다 버프 카드 3택1 (다음 웨이브 시작 전)
      if (wave % 5 === 0) { openCardPick(); return; }
    }
  }

  // 적 이동
  // 스킬 쿨다운
  skills.meteor = Math.max(0, skills.meteor - dt);
  skills.freeze = Math.max(0, skills.freeze - dt);

  // 무기 자동 생성 (빈 칸이 없으면 게이지 꽉 찬 채 대기)
  unitTimer = Math.min(unitTimer + dt, unitInterval());
  if (unitTimer >= unitInterval() && grid.some(s => !s)) {
    const t = rollBuyTier();
    addUnit(t);
    unitTimer = 0;
    sfx.buy();
    if (t >= 6) {
      floatText(W / 2, H / 2 - 100, "🎊 초대박! " + t + "등급 " + TIER_NAME[t - 1] + "!! 🎊", "#ffd93d", 30, 2);
      shakeT = 0.3;
      sfx.wave();
    }
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.frozen > 0) e.frozen -= dt;
    const slow = e.frozen > 0 ? 0.3 : 1; // ❄️ 빙결 시 감속
    e.wob += dt * 4 * slow;
    if (e.hitT > 0) e.hitT -= dt;

    // 👻 유령: 실체(2초) ↔ 무적(1.2초) 반복 — 무적 중에도 이동은 계속
    if (e.ghost) {
      e.ghostT -= dt;
      if (e.ghostT <= 0) {
        e.ghostInvuln = !e.ghostInvuln;
        e.ghostT = e.ghostInvuln ? 1.2 : 2;
        burst(e.x, e.y, "#b8a8e8", 8, 90);
      }
    }
    // 💚 힐러: 2초마다 주변 회복
    if (e.healer) {
      e.healT -= dt;
      if (e.healT <= 0) { e.healT = 2; healPulse(e); }
    }
    // 👑 보스 고유 패턴
    if (e.boss) updateBoss(e, dt);

    if (e.treasure) {
      // 🎁 보물 슬라임: 좌우로만 도망다니고 방어선으로는 내려오지 않는다
      e.tlife -= dt;
      e.x += e.tvx * slow * dt;
      if (e.x < 40)     { e.x = 40;     e.tvx = Math.abs(e.tvx); }
      if (e.x > W - 40) { e.x = W - 40; e.tvx = -Math.abs(e.tvx); }
      e.y = e.homeY + Math.sin(e.wob * 1.4) * 14;
      if (Math.random() < dt * 14)
        particles.push({ x: e.x + (Math.random() - 0.5) * e.r * 2, y: e.y, vx: (Math.random() - 0.5) * 40, vy: -50, life: 0.4, t: 0, color: "#ffd93d", r: 2 + Math.random() * 3 });
      if (e.tlife <= 0) { // 도주 (방어선 피해 없음)
        enemies.splice(i, 1);
        floatText(e.x, e.y - 20, "🎁 도망쳤다!", "#ffd93d", 22, 1.2);
        burst(e.x, e.y, "#ffd93d", 18, 170);
        continue;
      }
    } else {
      const rush = e.chargeT > 0 ? 4 : 1;  // 👑 돌진왕 질주
      e.y += e.speed * slow * rush * dt;
      e.x += Math.sin(e.wob) * 12 * dt;
      e.x = Math.max(e.r, Math.min(W - e.r, e.x));
    }

    // 화상 지속 피해
    if (e.burn && e.burn.t > 0) {
      e.burn.t -= dt;
      if (Math.random() < dt * 12) particles.push({ x: e.x + (Math.random() - 0.5) * e.r, y: e.y - e.r * 0.5, vx: (Math.random() - 0.5) * 30, vy: -60 - Math.random() * 40, life: 0.4, t: 0, color: Math.random() < 0.5 ? "#ff7b2e" : "#ffd93d", r: 3 + Math.random() * 3 });
      damageEnemy(e, e.burn.dps * dt, true);
      if (enemies.indexOf(e) === -1) continue;
    }
    if (!e.treasure && e.y > GRID_TOP - e.r - 20) {   // 방어선 도달 (보물 슬라임 제외)
      enemies.splice(i, 1);
      lives -= e.boss ? 3 : 1;
      shakeT = 0.35; flashT = 0.3;
      sfx.hurt();
      burst(e.x, GRID_TOP - 30, "#ff5555", 18, 150);
      if (lives <= 0) {
        lives = 0;
        gameOver(); // ⭐ 별조각 정산 + 신기록 갱신 (내부에서 1회만 실행)
      }
    }
  }

  // 유닛 공격
  updateChillLane(); // ❄️ 빙결왕 오라 레인 갱신 (매 프레임 1회)
  for (let i = 0; i < grid.length; i++) {
    const u = grid[i];
    if (!u) continue;
    if (u.pop > 0) u.pop -= dt * 3;
    if (u.recoil > 0) u.recoil -= dt * 6;
    u.cd -= dt;
    if (u.cd <= 0 && enemies.length) {
      const atk = ATTACK[u.tier - 1];
      const targets = laneEnemies(i % COLS, atk.count || 1); // 자기 열 앞의 적만
      if (targets.length) {
        fireWeapon(u.tier, cellCenter(i), targets);
        // ⏩ 공속 업그레이드 + 🌍 테마 기믹 + ❄️ 빙결왕 오라
        u.cd = 1 / (atk.rate * rateMult() * laneRateMult(i % COLS));
        u.recoil = 1;
      }
    }
  }

  // 투사체 (무기 종류별로 다르게 움직임)
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    let remove = false;

    if (p.kind === "homing") {
      // 유도형: basic / dagger / trident / slash / homing / fire
      const t = p.target;
      if (!t || t.hp <= 0 || enemies.indexOf(t) === -1) { remove = true; }
      else {
        const dx = t.x - p.x, dy = t.y - p.y, d = Math.hypot(dx, dy) || 1;
        p.rot = Math.atan2(dy, dx) + Math.PI / 2;
        if (p.sub === "slash") p.spin += dt * 18;
        // 마법탄/화염은 꼬리 파티클
        if ((p.sub === "homing" || p.sub === "fire") && Math.random() < dt * 40)
          particles.push({ x: p.x, y: p.y, vx: (Math.random() - 0.5) * 40, vy: (Math.random() - 0.5) * 40, life: 0.3, t: 0, color: p.sub === "fire" ? "#ff9b4f" : "#d9a0ff", r: 3 });
        if (d < t.r + 10) {
          if (p.aoe) aoeDamage(t.x, t.y, p.aoe, p.dmg, p.tier, p.burn);
          else { damageEnemy(t, p.dmg); burst(p.x, p.y, TIER_COLOR[p.tier - 1], 5, 90); }
          sfx.hit();
          remove = true;
        } else { p.x += dx / d * p.speed * dt; p.y += dy / d * p.speed * dt; }
      }
    } else if (p.kind === "pierce") {
      // 관통 화살/브레스: 직선 이동, 스치는 모든 적 타격
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.wide && Math.random() < dt * 30)
        particles.push({ x: p.x + (Math.random() - 0.5) * 40, y: p.y, vx: (Math.random() - 0.5) * 60, vy: 40, life: 0.35, t: 0, color: "#3dd96b", r: 4 });
      for (const e of [...enemies]) {
        if (!p.hitSet.has(e) && Math.hypot(e.x - p.x, e.y - p.y) < e.r + 10 + (p.wide || 0)) {
          p.hitSet.add(e);
          damageEnemy(e, p.dmg);
          burst(p.x, p.y, TIER_COLOR[p.tier - 1], 4, 80);
          sfx.hit();
        }
      }
      if (p.y < FIELD_TOP - 60 || p.x < -40 || p.x > W + 40 || p.y > H + 40) remove = true;
    } else if (p.kind === "tornado") {
      // 회오리: 위로 이동하며 범위 내 적 연속 타격 + 중심으로 끌어당김
      p.y -= p.speed * dt;
      p.rot += dt * 12;
      p.tick += dt;
      for (const e of enemies) {
        const d = Math.hypot(e.x - p.x, e.y - p.y);
        if (d < 80) e.x += (p.x - e.x) * 1.5 * dt; // 흡입
      }
      if (p.tick >= 0.22) {
        p.tick = 0;
        for (const e of [...enemies])
          if (Math.hypot(e.x - p.x, e.y - p.y) < 48 + e.r * 0.5) { damageEnemy(e, p.dmg); }
        burst(p.x, p.y, TIER_COLOR[p.tier - 1], 3, 70);
      }
      if (p.y < FIELD_TOP - 40) remove = true;
    } else if (p.kind === "smash") {
      // 골렘 주먹: 목표 지점으로 낙하 후 충격파
      const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy);
      if (d < 20) {
        aoeDamage(p.tx, p.ty, p.aoe, p.dmg, p.tier);
        shakeT = Math.max(shakeT, 0.2);
        sfx.hurt();
        remove = true;
      } else { p.x += dx / d * p.speed * dt; p.y += dy / d * p.speed * dt; }
    } else if (p.kind === "wave") {
      // 해일: 레인 폭 전체로 쓸어올림, 닿은 적 모두 1회 타격
      p.y -= p.speed * dt;
      p.wob += dt * 10;
      for (const e of [...enemies]) {
        if (!p.hitSet.has(e) && e.x >= p.left - e.r && e.x <= p.right + e.r && Math.abs(e.y - p.y) < 30 + e.r) {
          p.hitSet.add(e);
          damageEnemy(e, p.dmg);
          burst(e.x, p.y, "#7ec8ff", 8, 120);
          sfx.hit();
        }
      }
      if (p.y < FIELD_TOP - 40) remove = true;
    } else if (p.kind === "blackhole") {
      p.rot += dt * 6;
      if (p.phase === 0) {
        // 이동 단계
        const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy);
        if (d < 14) p.phase = 1;
        else { p.x += dx / d * p.speed * dt; p.y += dy / d * p.speed * dt; }
      } else {
        // 흡입 단계: 주변 적을 빨아들이며 0.2초마다 피해
        p.life -= dt;
        p.tick += dt;
        for (const e of enemies) {
          const d = Math.hypot(e.x - p.x, e.y - p.y);
          if (d < 130) {
            e.x += (p.x - e.x) * 2.2 * dt;
            e.y += (p.y - e.y) * 1.2 * dt;
          }
        }
        if (p.tick >= 0.2) {
          p.tick = 0;
          for (const e of [...enemies])
            if (Math.hypot(e.x - p.x, e.y - p.y) < 115) damageEnemy(e, p.dmg);
        }
        if (p.life <= 0) {
          burst(p.x, p.y, "#7b5cff", 30, 240);
          effects.push({ type: "ring", x: p.x, y: p.y, maxR: 130, life: 0.3, t: 0, color: "#7b5cff" });
          sfx.kill();
          remove = true;
        }
      }
    } else if (p.kind === "boom") {
      // 부메랑: 목표 지점까지 갔다가 되돌아옴, 경로의 적 모두 타격
      p.rot += dt * 16;
      const tx = p.phase === 0 ? p.tx : p.ox, ty = p.phase === 0 ? p.ty : p.oy;
      const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
      if (d < 16) {
        if (p.phase === 0) { p.phase = 1; p.hitSet.clear(); } // 돌아올 때 다시 타격 가능
        else remove = true;
      } else { p.x += dx / d * p.speed * dt; p.y += dy / d * p.speed * dt; }
      for (const e of [...enemies]) {
        if (!p.hitSet.has(e) && Math.hypot(e.x - p.x, e.y - p.y) < e.r + 16) {
          p.hitSet.add(e);
          damageEnemy(e, p.dmg);
          sfx.hit();
        }
      }
    } else if (p.kind === "star") {
      // 별똥별: 낙하 후 범위 폭발
      p.rot += dt * 8;
      if (Math.random() < dt * 30)
        particles.push({ x: p.x, y: p.y, vx: (Math.random() - 0.5) * 30, vy: -40, life: 0.35, t: 0, color: "#ffe97a", r: 3 });
      const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy);
      if (d < 18) { aoeDamage(p.tx, p.ty, p.aoe, p.dmg, p.tier, p.burn || 0); sfx.hit(); remove = true; }
      else { p.x += dx / d * p.speed * dt; p.y += dy / d * p.speed * dt; }
    }

    if (remove) projectiles.splice(i, 1);
  }

  // 지속 이펙트 (폭발 링, 번개)
  for (let i = effects.length - 1; i >= 0; i--) {
    effects[i].t += dt;
    if (effects[i].t > effects[i].life) effects.splice(i, 1);
  }

  // 파티클 & 텍스트
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt;
    if (p.t > p.life) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt;
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.t += dt;
    if (f.t > f.life) floats.splice(i, 1);
  }
  if (shakeT > 0) shakeT -= dt;
  if (flashT > 0) flashT -= dt;
}

// ---------- 그리기 ----------
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function outlinedText(txt, x, y, size, fill, stroke, lw) {
  ctx.font = "900 " + size + "px 'Segoe UI', 'Malgun Gothic', sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineJoin = "round";
  ctx.strokeStyle = stroke || "rgba(60,70,20,0.9)";
  ctx.lineWidth = lw || Math.max(3, size / 5);
  ctx.strokeText(txt, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(txt, x, y);
}

function drawField() {
  // 🌍 배경 (체크무늬) — 색상은 현재 스테이지 테마 팔레트에서 취득
  const th = curTheme();
  ctx.fillStyle = th.light;
  ctx.fillRect(0, 0, W, GRID_TOP);
  const cs = 60;
  ctx.fillStyle = "rgba(255,255,255,0.06)";
  for (let y = 0; y < GRID_TOP / cs + 1; y++)
    for (let x = 0; x < W / cs; x++)
      if ((x + y) % 2 === 0) ctx.fillRect(x * cs, y * cs, cs, Math.min(cs, GRID_TOP - y * cs));
  // 🌌 우주 테마: 잔잔한 별빛 (좌표는 고정 패턴)
  if (th.name === "우주") {
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    for (let i = 0; i < 46; i++) {
      const sx = (i * 97) % (W - 60) + 30, sy = (i * 151) % (GRID_TOP - 40) + 20;
      const tw = 0.4 + Math.abs(Math.sin(time * 1.6 + i)) * 0.6;
      ctx.globalAlpha = tw * 0.8;
      ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.globalAlpha = 1;
  }
  // 양옆 진한 길 표현
  ctx.fillStyle = th.dark;
  ctx.fillRect(0, 0, 26, GRID_TOP);
  ctx.fillRect(W - 26, 0, 26, GRID_TOP);
  // 드래그 중인 무기의 담당 레인 표시
  if (drag && grid[drag.idx]) {
    const col = Math.max(0, Math.min(COLS - 1, Math.floor(drag.x / CELL)));
    ctx.fillStyle = "rgba(255,255,255,0.14)";
    ctx.fillRect(col * CELL, FIELD_TOP, CELL, GRID_TOP - FIELD_TOP);
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 2;
    ctx.strokeRect(col * CELL + 1, FIELD_TOP, CELL - 2, GRID_TOP - FIELD_TOP);
  }
  // 방어선
  const ly = GRID_TOP - 14;
  ctx.strokeStyle = "rgba(255,80,80,0.55)";
  ctx.lineWidth = 4;
  ctx.setLineDash([14, 10]);
  ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(W, ly); ctx.stroke();
  ctx.setLineDash([]);
}

function drawEnemy(e) {
  const squish = 1 + Math.sin(e.wob * 2) * 0.06;
  // 💚 힐러 오라 링 (몸통 스케일 영향을 받지 않도록 먼저 그린다)
  if (e.healer) {
    ctx.save();
    ctx.globalAlpha = 0.22 + Math.abs(Math.sin(time * 4)) * 0.18;
    ctx.strokeStyle = "#4fd9a8"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 1.55, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  ctx.save();
  ctx.translate(e.x, e.y);
  // 👻 유령: 무적 위상 동안 반투명
  if (e.ghostInvuln) ctx.globalAlpha = 0.35;
  // 그림자
  ctx.fillStyle = "rgba(0,0,0,0.15)";
  ctx.beginPath(); ctx.ellipse(0, e.r * 0.85, e.r * 0.9, e.r * 0.3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.scale(squish, 2 - squish);
  // 몸통 (노란 블롭, 빙결 시 하늘색, 타입마다 고유 색)
  const bodyCol = e.hitT > 0 ? "#fff" : (e.frozen > 0 ? "#b8dcf0"
    : e.boss ? "#e8d44f" : e.tank ? "#c9bd7a"
    : e.healer ? "#a8e8c8" : e.shield ? "#b8bfcc" : e.ghost ? "#cfc4ee"
    : e.balloon ? "#ffc8dd" : e.treasure ? "#ffe27a" : "#d9d06a");
  ctx.fillStyle = bodyCol;
  ctx.beginPath();
  ctx.moveTo(-e.r, e.r * 0.8);
  ctx.bezierCurveTo(-e.r * 1.15, -e.r * 0.6, -e.r * 0.5, -e.r, 0, -e.r);
  ctx.bezierCurveTo(e.r * 0.5, -e.r, e.r * 1.15, -e.r * 0.6, e.r, e.r * 0.8);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(120,110,40,0.5)"; ctx.lineWidth = 2; ctx.stroke();
  // 가시
  ctx.fillStyle = bodyCol;
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo(i * e.r * 0.35 - 4, -e.r * 0.55);
    ctx.lineTo(i * e.r * 0.35, -e.r * 1.05);
    ctx.lineTo(i * e.r * 0.35 + 4, -e.r * 0.55);
    ctx.fill();
  }
  // 얼굴
  ctx.fillStyle = "#5a4a1a";
  ctx.beginPath(); ctx.arc(-e.r * 0.3, 0, e.r * 0.08, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(e.r * 0.3, 0, e.r * 0.08, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#5a4a1a"; ctx.lineWidth = Math.max(2, e.r * 0.07);
  ctx.beginPath(); ctx.arc(0, e.r * 0.15, e.r * 0.25, 0.2, Math.PI - 0.2); ctx.stroke();
  // 머리 위 꽃
  const fy = -e.r * 1.1;
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * Math.PI * 2 + e.wob * 0.3;
    ctx.fillStyle = e.flower;
    ctx.beginPath();
    ctx.ellipse(Math.cos(a) * e.r * 0.28, fy + Math.sin(a) * e.r * 0.28, e.r * 0.18, e.r * 0.12, a, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = "#e84f6b";
  ctx.beginPath(); ctx.arc(0, fy, e.r * 0.13, 0, Math.PI * 2); ctx.fill();
  // 👑 보스: 왕관 + 패턴 아이콘
  if (e.boss) {
    const bt = e.bossType;
    outlinedText("👑" + (bt === "summoner" ? "🔮" : bt === "charger" ? "💨" : bt === "chiller" ? "❄️" : ""), 0, -e.r * 1.5, e.r * 0.55, "#fff");
  }
  // 🛡️ 방패병: 남은 방패 수 표시
  if (e.shieldHits > 0) outlinedText("🛡️x" + e.shieldHits, 0, -e.r * 1.55, e.r * 0.44, "#eef2ff", "rgba(30,40,60,0.85)", 3);
  // 🎁 보물 슬라임: 선물 상자 + 남은 시간
  if (e.treasure) {
    outlinedText("🎁", 0, -e.r * 1.6, e.r * 0.75, "#fff");
    outlinedText(Math.max(0, Math.ceil(e.tlife)) + "초", 0, e.r * 1.35, e.r * 0.5, "#ffd93d", "rgba(0,0,0,0.7)", 3);
  }
  ctx.restore();
  // HP 숫자 (전장에 들어온 뒤에만 표시)
  const ty = e.y - e.r * (e.boss ? 1.9 : 1.75);
  if (isFinite(e.hp) && ty > 76) outlinedText(fmt(e.hp), e.x, ty, e.boss ? 34 : 24, "#fff");
}

// ---------- 무기별 투사체 그리기 ----------
function star5(r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 === 0 ? r : r * 0.45;
    if (i === 0) ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
    else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath();
}
function drawProjectile(p) {
  const col = TIER_COLOR[p.tier - 1];
  if (p.kind === "wave") { // 해일: 레인 폭 물의 장벽 (좌표계가 달라 별도 처리)
    ctx.save();
    ctx.fillStyle = "rgba(61,155,255,0.55)";
    ctx.beginPath();
    ctx.moveTo(p.left, p.y + 24);
    for (let x = p.left; x <= p.right; x += 12)
      ctx.lineTo(x, p.y + Math.sin(x * 0.15 + p.wob) * 6 - 8);
    ctx.lineTo(p.right, p.y + 24);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#cde9ff"; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let x = p.left; x <= p.right; x += 12) {
      const yy = p.y + Math.sin(x * 0.15 + p.wob) * 6 - 8;
      x === p.left ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
    }
    ctx.stroke();
    ctx.restore();
    return;
  }
  ctx.save();
  ctx.translate(p.x, p.y);
  const sub = p.sub || p.kind;

  if (sub === "dagger") {                      // 단검: 빠른 은빛 찌르기
    ctx.rotate(p.rot);
    ctx.fillStyle = "#e8e8f0";
    ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(3.5, 4); ctx.lineTo(-3.5, 4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = col; ctx.fillRect(-4.5, 4, 9, 4);
  } else if (p.kind === "pierce" && p.wide) {  // 드래곤 브레스: 거대한 용
    ctx.rotate(p.rot);
    const g = ctx.createRadialGradient(0, 0, 4, 0, 0, 40);
    g.addColorStop(0, "#b8ffcf"); g.addColorStop(0.5, "#3dd96b"); g.addColorStop(1, "rgba(61,217,107,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI * 2); ctx.fill();
    ctx.font = "44px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("🐉", 0, 0);
  } else if (p.kind === "pierce") {            // 관통 화살
    ctx.rotate(p.rot);
    ctx.strokeStyle = "#b07840"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 18); ctx.lineTo(0, -12); ctx.stroke();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(6, -8); ctx.lineTo(-6, -8); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-5, 18); ctx.lineTo(0, 12); ctx.lineTo(5, 18); ctx.stroke();
  } else if (p.kind === "boom") {              // 회전 부메랑
    ctx.rotate(p.rot);
    ctx.strokeStyle = col; ctx.lineWidth = 8; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-14, 6); ctx.lineTo(0, -8); ctx.lineTo(14, 6); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-14, 6); ctx.lineTo(0, -8); ctx.lineTo(14, 6); ctx.stroke();
  } else if (sub === "trident") {              // 삼지창: 세 갈래 창
    ctx.rotate(p.rot);
    ctx.fillStyle = col;
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath(); ctx.moveTo(k * 7, -14); ctx.lineTo(k * 7 + 3, -2); ctx.lineTo(k * 7 - 3, -2); ctx.closePath(); ctx.fill();
    }
    ctx.fillRect(-8, -3, 16, 3);
    ctx.fillRect(-1.5, -3, 3, 14);
  } else if (sub === "slash") {                // 대검: 빙글빙글 도는 큰 검
    ctx.rotate(p.spin || 0);
    ctx.fillStyle = "#dfe4ee";
    ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(6, -4); ctx.lineTo(6, 8); ctx.lineTo(-6, 8); ctx.lineTo(-6, -4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = col; ctx.fillRect(-11, 8, 22, 5);
    ctx.fillRect(-2.5, 13, 5, 8);
    ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 1.4); ctx.stroke();
  } else if (sub === "homing") {               // 마법탄: 빛나는 구슬
    const g = ctx.createRadialGradient(0, 0, 1, 0, 0, 12);
    g.addColorStop(0, "#fff"); g.addColorStop(0.4, "#e0b0ff"); g.addColorStop(1, "rgba(176,79,217,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
  } else if (sub === "fire") {                 // 화염구
    const g = ctx.createRadialGradient(0, 0, 1, 0, 0, 14);
    g.addColorStop(0, "#fff3b0"); g.addColorStop(0.4, "#ff9b4f"); g.addColorStop(1, "rgba(255,80,30,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffd93d";
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
  } else if (p.kind === "star") {              // 별똥별 / 용암탄
    ctx.rotate(p.rot);
    if (p.sub === "lava") {
      const g = ctx.createRadialGradient(0, 0, 1, 0, 0, 16);
      g.addColorStop(0, "#fff3b0"); g.addColorStop(0.45, "#ff5a2e"); g.addColorStop(1, "rgba(160,30,10,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#7a2e10";
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(Math.cos(i * 2.1) * 6, Math.sin(i * 2.1) * 6, 2.5, 0, Math.PI * 2); ctx.fill(); }
    } else {
      ctx.fillStyle = p.tier >= 11 ? TIER_COLOR[p.tier - 1] : "#ffe97a"; star5(14); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; star5(14); ctx.stroke();
    }
  } else if (p.kind === "tornado") {           // 회오리: 회전하는 소용돌이
    ctx.rotate(p.rot);
    for (let i = 3; i >= 1; i--) {
      ctx.strokeStyle = i % 2 ? "#7ee0c3" : "#b8f0e0";
      ctx.lineWidth = 5;
      ctx.globalAlpha = 0.85;
      ctx.beginPath(); ctx.arc(0, 0, i * 13, i, i + Math.PI * 1.3); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  } else if (p.kind === "smash") {             // 골렘 주먹: 낙하하는 돌주먹
    ctx.rotate(0.15);
    roundRect(-20, -22, 40, 44, 10);
    ctx.fillStyle = "#a58b6f"; ctx.fill();
    ctx.strokeStyle = "#6e5a45"; ctx.lineWidth = 3; ctx.stroke();
    for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(i * 11, -14, 5, Math.PI, 0); ctx.fillStyle = "#8a7256"; ctx.fill(); }
  } else if (p.kind === "blackhole") {         // 블랙홀: 소용돌이치는 어둠
    ctx.rotate(p.rot);
    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 26);
    g.addColorStop(0, "#000"); g.addColorStop(0.6, "#3a2a6e"); g.addColorStop(1, "rgba(123,92,255,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#b8a0ff"; ctx.lineWidth = 2.5;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.arc(0, 0, 14 + i * 5, i * 2.1, i * 2.1 + Math.PI); ctx.stroke();
    }
  } else {                                     // 기본 (곡괭이)
    ctx.rotate(p.rot);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(5, 8); ctx.lineTo(-5, 8); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 1.5; ctx.stroke();
  }
  ctx.restore();
}
function drawEffect(fx) {
  const k = fx.t / fx.life;
  if (fx.type === "ring") {
    ctx.globalAlpha = 1 - k;
    ctx.strokeStyle = fx.color; ctx.lineWidth = 6 * (1 - k) + 2;
    ctx.beginPath(); ctx.arc(fx.x, fx.y, fx.maxR * (0.3 + k * 0.7), 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = (1 - k) * 0.25;
    ctx.fillStyle = fx.color;
    ctx.beginPath(); ctx.arc(fx.x, fx.y, fx.maxR * (0.3 + k * 0.7), 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (fx.type === "bolt") {
    ctx.globalAlpha = 1 - k;
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.strokeStyle = "#ffe97a"; ctx.lineWidth = fx.w || 7;
    ctx.beginPath();
    fx.pts.forEach((pt, i) => i === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y));
    ctx.stroke();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = (fx.w || 7) * 0.35;
    ctx.stroke();
    ctx.globalAlpha = 1;
  } else if (fx.type === "beam") { // 신의 심판: 레인 전체 무지개 빔
    ctx.globalAlpha = (1 - k) * 0.85;
    const g = ctx.createLinearGradient(fx.left, 0, fx.right, 0);
    g.addColorStop(0, "rgba(255,155,224,0)");
    g.addColorStop(0.2, "#ff9be0"); g.addColorStop(0.4, "#ffe97a");
    g.addColorStop(0.6, "#7dffb2"); g.addColorStop(0.8, "#9ad8ff");
    g.addColorStop(1, "rgba(154,216,255,0)");
    ctx.fillStyle = g;
    ctx.fillRect(fx.left, FIELD_TOP, fx.right - fx.left, GRID_TOP - FIELD_TOP);
    ctx.globalAlpha = 1 - k;
    ctx.fillStyle = "#fff";
    ctx.fillRect((fx.left + fx.right) / 2 - 10 * (1 - k), FIELD_TOP, 20 * (1 - k), GRID_TOP - FIELD_TOP);
    ctx.globalAlpha = 1;
  }
}

function drawUnit(x, y, tier, scale, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.globalAlpha = alpha;
  roundRect(-34, -34, 68, 68, 14);
  ctx.fillStyle = TIER_COLOR[tier - 1];
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.25)"; ctx.lineWidth = 3; ctx.stroke();
  roundRect(-34, -34, 68, 30, 14);
  ctx.fillStyle = "rgba(255,255,255,0.22)"; ctx.fill();
  ctx.font = "38px serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(TIER_EMOJI[tier - 1], 0, -2);
  // 등급 뱃지
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  roundRect(8, 14, 26, 20, 8); ctx.fill();
  ctx.fillStyle = "#ffd93d";
  ctx.font = "900 15px sans-serif";
  ctx.fillText(tier, 21, 24);
  ctx.restore();
}

function drawGrid() {
  // 나무 판 배경
  ctx.fillStyle = "#c98a3d";
  ctx.fillRect(0, GRID_TOP - 8, W, H - GRID_TOP + 8);
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = c * CELL + 4, y = GRID_TOP + r * (CELL - 8) + 2;
      roundRect(x, y, CELL - 8, CELL - 12, 10);
      ctx.fillStyle = (r + c) % 2 === 0 ? "#e0a955" : "#d69c48";
      ctx.fill();
    }
  }
  // 유닛
  for (let i = 0; i < grid.length; i++) {
    const u = grid[i];
    if (!u) continue;
    if (drag && drag.idx === i) continue;
    const c = cellCenter(i);
    const s = 1 + Math.max(0, u.pop) * 0.25;
    drawUnit(c.x, c.y - Math.max(0, u.recoil) * 5, u.tier, s, 1);
  }
  // ❄️ 빙결왕 오라가 걸린 레인 표시 (공속 -30%)
  for (let c = 0; c < COLS; c++) {
    if (!isChilled(c)) continue;
    for (let r = 0; r < ROWS; r++) {
      const x = c * CELL + 4, y = GRID_TOP + r * (CELL - 8) + 2;
      roundRect(x, y, CELL - 8, CELL - 12, 10);
      ctx.fillStyle = "rgba(120,200,255,0.28)"; ctx.fill();
      ctx.strokeStyle = "rgba(200,240,255,0.75)"; ctx.lineWidth = 2; ctx.stroke();
      outlinedText("❄", x + 15, y + 15, 17, "#e4f6ff", "rgba(20,50,80,0.75)", 3);
    }
  }
  // 드래그 중 유닛
  if (drag && grid[drag.idx]) {
    const u = grid[drag.idx];
    // 🗑️ 판매 존 표시
    const overTrash = Math.hypot(drag.x - TRASH.x, drag.y - TRASH.y) <= TRASH.r + 12;
    ctx.beginPath(); ctx.arc(TRASH.x, TRASH.y, TRASH.r + (overTrash ? 6 : 0), 0, Math.PI * 2);
    ctx.fillStyle = overTrash ? "rgba(220,60,60,0.85)" : "rgba(40,40,40,0.65)";
    ctx.fill();
    ctx.strokeStyle = overTrash ? "#fff" : "rgba(255,255,255,0.4)";
    ctx.lineWidth = 3; ctx.stroke();
    ctx.font = "26px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("🗑️", TRASH.x, TRASH.y - 6);
    outlinedText("+" + fmt(sellPrice(u.tier)), TRASH.x, TRASH.y + 18, 13, "#ffd93d", "rgba(0,0,0,0.6)", 3);
    const to = slotAt({ x: drag.x, y: drag.y });
    // 합성 가능 하이라이트
    if (to >= 0 && to !== drag.idx && grid[to] && grid[to].tier === u.tier && u.tier < MAX_TIER) {
      const c = cellCenter(to);
      ctx.strokeStyle = "#ffd93d"; ctx.lineWidth = 5;
      roundRect(c.x - 42, c.y - 42, 84, 84, 14); ctx.stroke();
    }
    drawUnit(drag.x, drag.y - 12, u.tier, 1.15, 0.9);
  }
}

function drawHUD() {
  // 상단 바
  ctx.fillStyle = "rgba(40,55,20,0.85)";
  ctx.fillRect(0, 0, W, 60);
  outlinedText("💰 " + gold, 70, 30, 22, "#ffd93d", "rgba(0,0,0,0.6)", 4);
  outlinedText("❤️ " + lives, 190, 30, 22, "#ff8f8f", "rgba(0,0,0,0.6)", 4);
  outlinedText("웨이브 " + Math.max(wave, 1) + (wave > 0 && wave % 5 === 0 ? " 👑" : ""), 320, 30, 22, "#fff", "rgba(0,0,0,0.6)", 4);
  // 사운드 & 배속 버튼
  ctx.font = "26px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(soundOn ? "🔊" : "🔇", BTN.sound.x + 21, BTN.sound.y + 21);
  roundRect(BTN.speed.x, BTN.speed.y + 4, BTN.speed.w, BTN.speed.h - 8, 10);
  ctx.fillStyle = timeScale === 2 ? "#ffd93d" : "rgba(255,255,255,0.2)";
  ctx.fill();
  outlinedText(timeScale + "x", BTN.speed.x + 21, BTN.speed.y + 21, 19, timeScale === 2 ? "#5a4a10" : "#fff", "rgba(0,0,0,0.4)", 3);

  // 스킬 버튼 (쿨다운 표시)
  for (const sb of SKILL_BTNS) {
    const cd = skills[sb.key], ready = cd <= 0;
    ctx.beginPath(); ctx.arc(sb.x, sb.y, sb.r, 0, Math.PI * 2);
    ctx.fillStyle = ready ? "rgba(40,55,20,0.85)" : "rgba(40,40,40,0.7)";
    ctx.fill();
    ctx.strokeStyle = ready ? "#ffd93d" : "rgba(255,255,255,0.3)";
    ctx.lineWidth = 3; ctx.stroke();
    ctx.globalAlpha = ready ? 1 : 0.45;
    ctx.font = "26px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(sb.icon, sb.x, sb.y + 1);
    ctx.globalAlpha = 1;
    if (!ready) { // 쿨다운 파이 + 남은 초
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.beginPath();
      ctx.moveTo(sb.x, sb.y);
      ctx.arc(sb.x, sb.y, sb.r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, cd / skillCd(sb.key)));
      ctx.closePath(); ctx.fill();
      outlinedText(Math.ceil(cd), sb.x, sb.y, 20, "#fff");
    } else if (state === "play") { // 사용 가능 반짝임
      ctx.globalAlpha = 0.4 + Math.sin(time * 5) * 0.3;
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sb.x, sb.y, sb.r + 4, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // 구매 버튼
  const b = BTN.buy, afford = gold >= buyCost();
  roundRect(b.x, b.y, b.w, b.h, 14);
  ctx.fillStyle = afford ? "#8e44d9" : "#777";
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.3)"; ctx.lineWidth = 3; ctx.stroke();
  outlinedText("즉시 뽑기 💰" + buyCost(), b.x + b.w / 2, b.y + b.h / 2, 19, "#fff", "rgba(0,0,0,0.5)", 4);

  // 다음 무기 자동 생성 게이지
  const gy = GRID_TOP - 80, full = grid.every(s => s);
  roundRect(12, gy, W - 24, 9, 5);
  ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.fill();
  const prog = Math.min(1, unitTimer / unitInterval());
  if (prog > 0.03) {
    roundRect(12, gy, (W - 24) * prog, 9, 5);
    ctx.fillStyle = full ? "#999" : "#7dffb2"; ctx.fill();
  }
  outlinedText(full ? "칸이 가득 참! 합성하세요" : "다음 무기 자동 생성 중...", W / 2, gy - 12, 15, full ? "#ffd93d" : "#fff", "rgba(0,0,0,0.5)", 3);

  // 업그레이드 버튼 3종
  for (const ub of BTN.upg) {
    const cost = upgCost(ub.key), ok = gold >= cost;
    roundRect(ub.x, ub.y, ub.w, ub.h, 12);
    ctx.fillStyle = ok ? "#2f9e6e" : "#6b6b6b";
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.3)"; ctx.lineWidth = 3; ctx.stroke();
    outlinedText(ub.icon + ub.pct, ub.x + ub.w / 2, ub.y + 15, 14, "#fff", "rgba(0,0,0,0.5)", 3);
    outlinedText("💰" + cost, ub.x + ub.w / 2, ub.y + 39, 14, "#ffd93d", "rgba(0,0,0,0.5)", 3);
    // 레벨 뱃지
    if (upg[ub.key] > 0) {
      ctx.fillStyle = "#ffd93d";
      roundRect(ub.x + ub.w - 26, ub.y - 8, 30, 18, 8); ctx.fill();
      ctx.fillStyle = "#5a4a10";
      ctx.font = "900 12px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("Lv" + upg[ub.key], ub.x + ub.w - 11, ub.y + 1);
    }
  }

  // 🃏 획득한 버프 카드 아이콘 줄 (중첩 수 표시)
  if (runBuffs.length) {
    const seen = [];
    for (const id of runBuffs) if (seen.indexOf(id) === -1) seen.push(id);
    const bw = 26, bx = W / 2 - seen.length * bw / 2;
    ctx.fillStyle = "rgba(40,55,20,0.55)";
    roundRect(bx - 6, 62, seen.length * bw + 12, 24, 8); ctx.fill();
    for (let i = 0; i < seen.length; i++) {
      const c = cardById(seen[i]);
      if (!c) continue;
      ctx.font = "17px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = "#fff";
      ctx.fillText(c.icon, bx + i * bw + bw / 2, 75);
      const n = buffCount(seen[i]);
      if (n > 1) outlinedText(n, bx + i * bw + bw - 3, 82, 11, "#ffd93d", "rgba(0,0,0,0.8)", 3);
    }
  }

  // 🌍 현재 테마 뱃지 (좌) / 🎪 진행 중 이벤트 뱃지 (우)
  const th = curTheme();
  outlinedText(th.icon + " " + th.name, 58, FIELD_TOP + 12, 16, "#fff", "rgba(0,0,0,0.6)", 4);
  if (waveEvent && EVENTS[waveEvent]) {
    const ev = EVENTS[waveEvent];
    outlinedText(ev.icon + " " + ev.name, W - 70, FIELD_TOP + 12, 16, ev.color, "rgba(0,0,0,0.65)", 4);
  }

  // 다음 웨이브 안내
  if (!waveActive && state === "play") {
    outlinedText("다음 웨이브까지 " + Math.ceil(waveDelay) + "초", W / 2, FIELD_TOP + 40, 22, "#fff");
  }
  // 조작 안내 (첫 웨이브 동안)
  if (wave <= 1) {
    outlinedText("같은 무기를 드래그해서 합치세요!", W / 2 - 30, GRID_TOP - 154, 20, "#fff");
    outlinedText("무기는 자기 세로줄 앞의 적만 공격해요!", W / 2 - 30, GRID_TOP - 126, 18, "#ffd93d");
  }
}

// 잔디 체크무늬 배경 (타이틀/메뉴 공용)
function drawGrassBg() {
  ctx.fillStyle = "#a8cc3e";
  ctx.fillRect(0, 0, W, H);
  const cs = 60;
  ctx.fillStyle = "rgba(255,255,255,0.07)";
  for (let y = 0; y < H / cs; y++)
    for (let x = 0; x < W / cs; x++)
      if ((x + y) % 2 === 0) ctx.fillRect(x * cs, y * cs, cs, cs);
}
// 공용 버튼 그리기
function drawButton(b, label, size, bg, fg) {
  roundRect(b.x, b.y, b.w, b.h, 14);
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.32)"; ctx.lineWidth = 3; ctx.stroke();
  outlinedText(label, b.x + b.w / 2, b.y + b.h / 2, size, fg || "#fff", "rgba(0,0,0,0.5)", 4);
}
// 메뉴 화면 공용: 뒤로 버튼 + 안내 문구
function drawBackAndToast() {
  drawButton(BACK_BTN, "◀ 뒤로", 22, "#5a6b3a");
  if (toast && time < toast.until) {
    ctx.globalAlpha = Math.min(1, (toast.until - time) * 2.5);
    outlinedText(toast.txt, W / 2, BACK_BTN.y - 34, 20, toast.color, "rgba(0,0,0,0.7)", 4);
    ctx.globalAlpha = 1;
  }
}

function drawTitle() {
  drawGrassBg();
  // 떠다니는 슬라임 장식 (hp: NaN → HP 숫자 미표시)
  for (let i = 0; i < 3; i++) {
    drawEnemy({ x: 100 + i * 140, y: 190 + Math.sin(time * 1.5 + i * 2) * 12, r: 34, wob: time * 3 + i, hitT: 0, boss: false, flower: i === 1 ? "#ffb7d5" : "#fff", hp: NaN, maxHp: 1, speed: 0 });
  }
  outlinedText("슬라임", W / 2, 330, 64, "#fff", "rgba(60,80,20,0.9)", 12);
  outlinedText("머지 디펜스", W / 2, 400, 64, "#ffd93d", "rgba(60,80,20,0.9)", 12);
  drawUnit(W / 2 - 90, 500, 1, 1, 1);
  outlinedText("+", W / 2 - 45, 500, 30, "#fff");
  drawUnit(W / 2, 500, 1, 1, 1);
  outlinedText("=", W / 2 + 45, 500, 30, "#fff");
  drawUnit(W / 2 + 90, 500, 2, 1.1, 1);
  const pulse = 1 + Math.sin(time * 4) * 0.05;
  outlinedText("화면을 터치해서 시작!", W / 2, 600 + Math.sin(time * 4) * 3, 28 * pulse, "#fff");
  if (best > 0) outlinedText("🏆 최고 기록: 웨이브 " + best, W / 2, 655, 22, "#ffd93d");
  // ⭐ 영구 강화 / 📖 도감 진입 버튼
  drawButton(TITLE_BTN.meta, "⭐ 영구 강화", 21, "#8e44d9");
  drawButton(TITLE_BTN.dex,  "📖 도감 " + dex.length + "/" + MAX_TIER, 21, "#2f9e6e");
  outlinedText("보유 별조각  ⭐ " + shards, W / 2, 796, 22, "#ffd93d", "rgba(60,80,20,0.9)", 5);
}

// ============================================================
//  ⭐ 메타 상점 화면
// ============================================================
function drawMeta() {
  drawGrassBg();
  ctx.fillStyle = "rgba(20,25,10,0.72)";
  ctx.fillRect(0, 0, W, H);
  outlinedText("⭐ 영구 강화", W / 2, 62, 38, "#ffd93d", "rgba(0,0,0,0.8)", 8);
  outlinedText("보유 별조각  ⭐ " + shards, W / 2, 112, 24, "#fff", "rgba(0,0,0,0.7)", 5);

  for (let i = 0; i < META_ITEMS.length; i++) {
    const it = META_ITEMS[i], r = metaRowRect(i), b = metaBuyRect(i);
    const lv = meta[it.key] || 0, maxed = lv >= it.max;
    const cost = maxed ? 0 : it.cost(lv);
    const afford = !maxed && shards >= cost;
    // 행 배경
    roundRect(r.x, r.y, r.w, r.h, 14);
    ctx.fillStyle = "rgba(255,255,255,0.10)"; ctx.fill();
    ctx.strokeStyle = maxed ? "#ffd93d" : "rgba(255,255,255,0.18)"; ctx.lineWidth = 2; ctx.stroke();
    // 이름 / 설명 / 레벨
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.font = "26px serif";
    ctx.fillStyle = "#fff";
    ctx.fillText(it.icon, r.x + 14, r.y + 30);
    ctx.font = "900 20px 'Segoe UI', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "#fff";
    ctx.fillText(it.name, r.x + 48, r.y + 28);
    ctx.font = "15px 'Segoe UI', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    ctx.fillText(it.desc, r.x + 16, r.y + 57);
    // 레벨 게이지 (칸 표시)
    const gx = r.x + 16, gy = r.y + 74, gw = r.w - 160;
    for (let k = 0; k < it.max; k++) {
      const cw = gw / it.max - 3;
      ctx.fillStyle = k < lv ? "#ffd93d" : "rgba(255,255,255,0.2)";
      ctx.fillRect(gx + k * (gw / it.max), gy, Math.max(3, cw), 7);
    }
    ctx.font = "900 15px 'Segoe UI', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "#ffd93d";
    ctx.fillText(lv + " / " + it.max, r.x + r.w - 148, r.y + 58);
    // 구매 버튼
    roundRect(b.x, b.y, b.w, b.h, 12);
    ctx.fillStyle = maxed ? "#5a5a5a" : (afford ? "#8e44d9" : "#6b6b6b");
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.3)"; ctx.lineWidth = 3; ctx.stroke();
    if (maxed) outlinedText("MAX", b.x + b.w / 2, b.y + b.h / 2, 20, "#ffd93d", "rgba(0,0,0,0.5)", 4);
    else {
      outlinedText("강화", b.x + b.w / 2, b.y + 18, 16, "#fff", "rgba(0,0,0,0.5)", 3);
      outlinedText("⭐ " + cost, b.x + b.w / 2, b.y + 40, 17, afford ? "#ffd93d" : "#ccc", "rgba(0,0,0,0.5)", 3);
    }
  }
  ctx.textAlign = "center";
  drawBackAndToast();
}

// ============================================================
//  📖 무기 도감 화면
// ============================================================
function drawDex() {
  drawGrassBg();
  ctx.fillStyle = "rgba(20,25,10,0.72)";
  ctx.fillRect(0, 0, W, H);
  const done = dex.length >= MAX_TIER;
  outlinedText("📖 무기 도감", W / 2, 58, 36, "#fff", "rgba(0,0,0,0.8)", 8);
  if (done) outlinedText("🏆 완전 정복!", W / 2, 106, 28, "#ffd93d", "rgba(0,0,0,0.8)", 6);
  else outlinedText("발견 " + dex.length + " / " + MAX_TIER, W / 2, 106, 24, "#ffd93d", "rgba(0,0,0,0.7)", 5);

  for (let i = 0; i < MAX_TIER; i++) {
    const tier = i + 1, r = dexCellRect(i), found = dex.indexOf(tier) !== -1;
    roundRect(r.x, r.y, r.w, r.h, 12);
    ctx.fillStyle = found ? TIER_COLOR[i] : "rgba(0,0,0,0.45)";
    ctx.fill();
    ctx.strokeStyle = found ? "rgba(255,255,255,0.55)" : "rgba(255,255,255,0.12)";
    ctx.lineWidth = 2; ctx.stroke();
    if (found) {
      roundRect(r.x, r.y, r.w, r.h * 0.42, 12);
      ctx.fillStyle = "rgba(255,255,255,0.2)"; ctx.fill();
      ctx.font = "34px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = "#fff";
      ctx.fillText(TIER_EMOJI[i], r.x + r.w / 2, r.y + 32);
      outlinedText(TIER_NAME[i], r.x + r.w / 2, r.y + 66, 13, "#fff", "rgba(0,0,0,0.65)", 3);
      outlinedText(tier, r.x + 14, r.y + 13, 13, "#ffd93d", "rgba(0,0,0,0.7)", 3);
    } else {
      outlinedText("?", r.x + r.w / 2, r.y + r.h / 2 - 4, 34, "rgba(255,255,255,0.35)", "rgba(0,0,0,0.5)", 5);
      outlinedText(tier + "등급", r.x + r.w / 2, r.y + r.h - 16, 12, "rgba(255,255,255,0.4)", "rgba(0,0,0,0.5)", 3);
    }
  }
  drawBackAndToast();
}

// ============================================================
//  🃏 버프 카드 선택 화면
// ============================================================
function drawCardPick() {
  if (!cardPick) return;
  ctx.fillStyle = "rgba(15,20,8,0.86)";
  ctx.fillRect(0, 0, W, H);
  outlinedText("🃏 버프 카드 선택", W / 2, 96, 34, "#ffd93d", "rgba(0,0,0,0.8)", 8);
  outlinedText("웨이브 " + wave + " 클리어 보상 — 하나를 고르세요", W / 2, 142, 17, "#fff", "rgba(0,0,0,0.7)", 4);

  for (let i = 0; i < cardPick.cards.length; i++) {
    const c = cardPick.cards[i], r = cardRect(i);
    const chosen = cardPick.sel === i;
    const dim = cardPick.sel >= 0 && !chosen;
    ctx.save();
    if (chosen) { // 선택 연출: 살짝 확대 + 반짝임
      const k = 1 - Math.max(0, cardPick.selT) / 0.45;
      ctx.translate(r.x + r.w / 2, r.y + r.h / 2);
      ctx.scale(1 + k * 0.08, 1 + k * 0.08);
      ctx.translate(-(r.x + r.w / 2), -(r.y + r.h / 2));
    }
    ctx.globalAlpha = dim ? 0.3 : 1;
    roundRect(r.x, r.y, r.w, r.h, 18);
    ctx.fillStyle = chosen ? "#3d6b2e" : "#2e3a1c";
    ctx.fill();
    ctx.strokeStyle = chosen ? "#ffd93d" : "rgba(255,217,61,0.6)";
    ctx.lineWidth = chosen ? 6 : 3;
    ctx.stroke();
    // 아이콘 원
    ctx.beginPath(); ctx.arc(r.x + 62, r.y + r.h / 2, 40, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fill();
    ctx.font = "42px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#fff";
    ctx.fillText(c.icon, r.x + 62, r.y + r.h / 2 + 2);
    // 이름 & 설명
    ctx.textAlign = "left";
    ctx.font = "900 24px 'Segoe UI', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "#ffd93d";
    ctx.fillText(c.name, r.x + 118, r.y + 50);
    ctx.font = "16px 'Segoe UI', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "#fff";
    ctx.fillText(c.desc, r.x + 118, r.y + 84);
    ctx.font = "13px 'Segoe UI', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = c.once ? "#9ad8ff" : "#7dffb2";
    ctx.fillText(c.once ? "1회성" : "중첩 가능 (현재 " + buffCount(c.id) + "중첩)", r.x + 118, r.y + 114);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = "center";
}

// ============================================================
//  🏁 결과 화면 (강화판)
// ============================================================
// 최종 무기 진형 미니 스냅샷 (5x3 축소판)
function drawSnapshot(cx, cy) {
  const cw = 56, ch = 48;
  const x0 = cx - COLS * cw / 2, y0 = cy;
  ctx.fillStyle = "rgba(201,138,61,0.55)";
  roundRect(x0 - 6, y0 - 6, COLS * cw + 12, ROWS * ch + 12, 10); ctx.fill();
  for (let i = 0; i < ROWS * COLS; i++) {
    const c = i % COLS, r = Math.floor(i / COLS);
    const x = x0 + c * cw, y = y0 + r * ch;
    const u = grid && grid[i];
    roundRect(x + 2, y + 2, cw - 4, ch - 4, 7);
    ctx.fillStyle = u ? TIER_COLOR[u.tier - 1] : "rgba(0,0,0,0.35)";
    ctx.fill();
    if (u) {
      ctx.font = "24px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = "#fff";
      ctx.fillText(TIER_EMOJI[u.tier - 1], x + cw / 2, y + ch / 2 - 3);
      outlinedText(u.tier, x + cw - 12, y + ch - 12, 11, "#ffd93d", "rgba(0,0,0,0.7)", 3);
    }
  }
}
function drawOver() {
  ctx.fillStyle = "rgba(20,25,10,0.88)";
  ctx.fillRect(0, 0, W, H);
  outlinedText("게임 오버", W / 2, 92, 50, "#ff6b6b", "rgba(0,0,0,0.8)", 10);

  outlinedText("도달 웨이브  " + wave, W / 2, 158, 28, "#fff");
  outlinedText("처치한 슬라임  " + kills + "마리", W / 2, 198, 22, "#fff");
  const pt = Math.max(1, Math.min(MAX_TIER, peakTier));
  outlinedText("최고 등급  " + TIER_EMOJI[pt - 1] + " " + TIER_NAME[pt - 1] + " (" + pt + ")", W / 2, 238, 22, TIER_COLOR[pt - 1]);

  // ⭐ 획득 별조각
  ctx.fillStyle = "rgba(255,217,61,0.12)";
  roundRect(70, 262, W - 140, 52, 12); ctx.fill();
  ctx.strokeStyle = "rgba(255,217,61,0.55)"; ctx.lineWidth = 2; ctx.stroke();
  outlinedText("+" + earnedShards + " ⭐", W / 2 - 46, 288, 26, "#ffd93d");
  outlinedText("(보유 " + shards + ")", W / 2 + 62, 289, 17, "#fff");

  if (newRecord) outlinedText("🏆 신기록 달성!", W / 2, 340, 26, "#ffd93d");
  else outlinedText("🏆 최고 기록: 웨이브 " + best, W / 2, 340, 20, "#ffd93d");

  // 🃏 획득 버프 요약
  if (runBuffs.length) {
    let s = "";
    const seen = [];
    for (const id of runBuffs) {
      if (seen.indexOf(id) !== -1) continue;
      seen.push(id);
      const c = cardById(id);
      if (c) s += c.icon + (buffCount(id) > 1 ? "x" + buffCount(id) : "") + " ";
    }
    outlinedText("획득 버프  " + s.trim(), W / 2, 376, 17, "#7dffb2");
  }

  outlinedText("최종 진형", W / 2, 410, 18, "#fff");
  drawSnapshot(W / 2, 430);

  drawButton(OVER_BTN.again, "🔄 다시 시작", 22, "#8e44d9");
  drawButton(OVER_BTN.title, "🏠 타이틀로", 22, "#5a6b3a");
  outlinedText("⭐ 영구 강화로 더 강해질 수 있어요!", W / 2, 730, 17, "#ffd93d");
}

function draw() {
  ctx.save();
  if (shakeT > 0) ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);

  // 메뉴 계열 화면은 전장을 그리지 않는다
  if (state === "title") { drawTitle(); ctx.restore(); return; }
  if (state === "meta")  { drawMeta();  ctx.restore(); return; }
  if (state === "dex")   { drawDex();   ctx.restore(); return; }

  drawField();
  // 적 (아래쪽이 위에 그려지도록 정렬)
  const sorted = [...enemies].sort((a, b) => a.y - b.y);
  for (const e of sorted) drawEnemy(e);
  // 투사체
  for (const p of projectiles) drawProjectile(p);
  // 파티클
  for (const p of particles) {
    ctx.globalAlpha = 1 - p.t / p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 폭발 링 & 번개
  for (const fx of effects) drawEffect(fx);

  drawGrid();
  drawHUD();

  // 🎪 이벤트 웨이브 화면 테두리 (골드 러시=금색 / 러시아워=빨강 / 보물=초록)
  if (waveEvent && EVENTS[waveEvent] && state === "play") {
    ctx.save();
    ctx.globalAlpha = 0.45 + Math.abs(Math.sin(time * 4)) * 0.4;
    ctx.strokeStyle = EVENTS[waveEvent].border;
    ctx.lineWidth = 9;
    ctx.strokeRect(4.5, 4.5, W - 9, H - 9);
    ctx.restore();
  }

  // 떠오르는 텍스트
  for (const f of floats) {
    const k = f.t / f.life;
    ctx.globalAlpha = 1 - k * k;
    outlinedText(f.txt, f.x, f.y - k * 46, f.size, f.color);
    ctx.globalAlpha = 1;
  }

  // 피격 플래시
  if (flashT > 0) {
    ctx.fillStyle = "rgba(255,50,50," + flashT * 0.5 + ")";
    ctx.fillRect(0, 0, W, H);
  }

  if (state === "card") drawCardPick(); // 🃏 카드 선택 오버레이 (전장 위에)
  if (state === "over") drawOver();
  ctx.restore();
}

// ---------- 메인 루프 ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt * timeScale); // ⏩ 배속 적용
  draw();
  requestAnimationFrame(loop);
}
reset();
state = "title";
requestAnimationFrame(loop);
</script>
</body>
