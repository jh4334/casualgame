<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>슬라임 머지 디펜스</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #2a3d1f;
    overflow: hidden;
    touch-action: none;
    font-family: 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; border-radius: 8px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
"use strict";
// ============================================================
//  슬라임 머지 디펜스 — Merge Defense Game
//  같은 무기를 합쳐서 강화하고, 몰려오는 슬라임을 막아내세요!
// ============================================================

const W = 480, H = 840;
const COLS = 5, ROWS = 3;
const GRID_TOP = H - 300;          // 격자판 시작 y
const CELL = W / COLS;             // 96
const FIELD_TOP = 70;              // 전장 시작 y (HUD 아래)
const MAX_TIER = 20;

const TIER_EMOJI = ["⛏️","🗡️","🏹","🪃","🔱","⚔️","🪄","🔥","⚡","🌟","💫","🌪️","🗿","☄️","🌊","🌩️","🌋","🌀","🐉","🌈"];
const TIER_COLOR = ["#9b7bd8","#8fd14f","#e8a33d","#d97b4f","#4fb7d9","#d94f6b","#b04fd9","#ff7b2e","#ffd93d","#7dffb2",
                    "#9ad8ff","#7ee0c3","#a58b6f","#ff6b3d","#3d9bff","#ffe14f","#e0443d","#7b5cff","#3dd96b","#ff9be0"];
const TIER_NAME  = ["곡괭이","단검","활","부메랑","삼지창","대검","마법지팡이","화염","번개","별의 힘",
                    "혜성","회오리","골렘 주먹","메테오","해일","뇌신","화산","블랙홀","드래곤","신의 심판"];

// ---------- 캔버스 & 스케일 ----------
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
function fit() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = W * scale + "px";
  canvas.style.height = H * scale + "px";
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", fit);
fit();

function ptFromEvent(e) {
  const r = canvas.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX);
  const cy = (e.touches ? e.touches[0].clientY : e.clientY);
  return { x: (cx - r.left) / r.width * W, y: (cy - r.top) / r.height * H };
}

// ---------- 사운드 (WebAudio) ----------
let audioCtx = null, soundOn = true;
function beep(freq, dur, type, vol, slide) {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, audioCtx.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.04, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  shoot: () => beep(700, 0.06, "square", 0.015, 400),
  hit:   () => beep(250, 0.05, "triangle", 0.03),
  kill:  () => beep(500, 0.15, "triangle", 0.04, 900),
  merge: () => { beep(400, 0.1, "square", 0.04, 800); setTimeout(() => beep(800, 0.15, "square", 0.04, 1200), 80); },
  buy:   () => beep(600, 0.08, "sine", 0.05, 750),
  hurt:  () => beep(150, 0.3, "sawtooth", 0.06, 60),
  wave:  () => { beep(523, 0.12, "square", 0.04); setTimeout(() => beep(659, 0.12, "square", 0.04), 120); setTimeout(() => beep(784, 0.2, "square", 0.04), 240); },
  error: () => beep(180, 0.12, "sawtooth", 0.04),
};

// ============================================================
//  💾 저장소 (localStorage) — 파싱 실패/구버전 데이터도 안전하게 폴백
// ============================================================
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }

// ---------- ⭐ 영구 성장(메타) 항목 정의 ----------
const META_ITEMS = [
  { key: "gold",  icon: "💰", name: "시작 골드", desc: "게임 시작 골드 +50",         max: 10, cost: lv => Math.floor(20  * Math.pow(1.5, lv)) },
  { key: "tier",  icon: "🗡️", name: "시작 등급", desc: "시작 무기 2개의 등급 +1",    max: 5,  cost: lv => Math.floor(100 * Math.pow(3, lv))   },
  { key: "lives", icon: "❤️", name: "생명",      desc: "시작 생명 +1",               max: 5,  cost: lv => Math.floor(50  * Math.pow(2, lv))   },
  { key: "cdr",   icon: "⏳", name: "스킬 단련", desc: "스킬 쿨다운 -5%",            max: 8,  cost: lv => Math.floor(40  * Math.pow(2, lv))   },
  { key: "luck",  icon: "🍀", name: "행운",      desc: "뽑기 고등급(6~10) 확률 +8%", max: 10, cost: lv => Math.floor(60  * Math.pow(2, lv))   },
];

function loadShards() {
  const n = Number(lsGet("smd_shards"));
  return (isFinite(n) && n > 0) ? Math.floor(n) : 0;
}
function loadMeta() {
  const d = { gold: 0, tier: 0, lives: 0, cdr: 0, luck: 0 };
  try {
    const raw = lsGet("smd_meta");
    if (!raw) return d;
    const o = JSON.parse(raw);
    if (!o || typeof o !== "object") return d;
    for (const it of META_ITEMS) {
      const v = Math.floor(Number(o[it.key]));
      if (isFinite(v) && v > 0) d[it.key] = Math.min(it.max, v); // 최대 레벨로 클램프
    }
  } catch (e) {}
  return d;
}
function loadDex() {
  try {
    const raw = lsGet("smd_dex");
    if (!raw) return [];
    const a = JSON.parse(raw);
    if (!Array.isArray(a)) return [];
    const out = [];
    for (const v of a) {
      const t = Math.floor(Number(v));
      if (isFinite(t) && t >= 1 && t <= MAX_TIER && out.indexOf(t) === -1) out.push(t);
    }
    return out;
  } catch (e) { return []; }
}
function saveShards() { lsSet("smd_shards", shards); }
function saveMeta()   { try { lsSet("smd_meta", JSON.stringify(meta)); } catch (e) {} }
function saveDex()    { try { lsSet("smd_dex", JSON.stringify(dex)); } catch (e) {} }

let shards = loadShards();      // 보유 별조각
let meta = loadMeta();          // 영구 강화 레벨
let dex = loadDex();            // 📖 도감: 발견한 등급 목록

// 📖 도감 등록 (무기를 처음 손에 넣은 순간 호출)
function discover(tier) {
  if (!(tier >= 1 && tier <= MAX_TIER)) return;
  if (dex.indexOf(tier) !== -1) return;
  dex.push(tier);
  saveDex();
}

// ---------- 🃏 웨이브 버프 카드 풀 ----------
// once: true = 1회성(중복 획득 불가), false = 중첩 가능
const CARD_POOL = [
  { id: "pierce40", icon: "🏹", name: "관통의 극의", desc: "관통·해일 계열 데미지 +40%", once: false },
  { id: "aoe25",    icon: "💥", name: "폭심지",      desc: "모든 폭발 범위 +25%",        once: true  },
  { id: "burn2",    icon: "🔥", name: "겁화",        desc: "화상 지속시간 2배",          once: true  },
  { id: "chain2",   icon: "⚡", name: "전도체",      desc: "번개 연쇄 +2회",             once: true  },
  { id: "gold30",   icon: "💰", name: "황금손",      desc: "처치 골드 +30%",             once: false },
  { id: "spawn20",  icon: "📦", name: "조달 계약",   desc: "무기 자동 생성 속도 +20%",   once: false },
  { id: "sell2",    icon: "🏪", name: "고물상",      desc: "무기 판매가 2배",            once: true  },
  { id: "freeze2",  icon: "❄️", name: "절대영도",    desc: "프리즈 지속 +2초",           once: true  },
  { id: "meteor2",  icon: "☄️", name: "유성우",      desc: "메테오 낙하 +2발",           once: true  },
  { id: "jack2",    icon: "🎉", name: "대박 체질",   desc: "합성 대박 확률 2배 (24%)",   once: true  },
  { id: "atk10",    icon: "⏩", name: "광전사",      desc: "모든 무기 공격 속도 +10%",   once: false },
  { id: "dmg15",    icon: "⚔️", name: "마력 각성",   desc: "모든 무기 데미지 +15%",      once: false },
];
function cardById(id) { for (const c of CARD_POOL) if (c.id === id) return c; return null; }

// ============================================================
//  🌍 스테이지 테마 (10웨이브마다 순환) — Phase 2
//  hp/speed = 적 스탯 곱연산 기믹, rate = 무기 공속 곱연산 기믹
// ============================================================
const THEMES = [
  { icon: "🌱", name: "초원", light: "#a8cc3e", dark: "#8db32e", hp: 1,    speed: 1,   rate: 1,   desc: "평화로운 기본 전장" },
  { icon: "🏜️", name: "사막", light: "#d9c77a", dark: "#c9b25e", hp: 1,    speed: 1.1, rate: 1,   desc: "적 이동속도 +10%" },
  { icon: "🌋", name: "화산", light: "#8a5a4a", dark: "#7a4a3a", hp: 1.15, speed: 1,   rate: 1,   desc: "적 체력 +15%" },
  { icon: "❄️", name: "설원", light: "#c8dce8", dark: "#b0c8da", hp: 1,    speed: 1,   rate: 0.9, desc: "무기 공격속도 -10%" },
  { icon: "🌌", name: "우주", light: "#3a3a5e", dark: "#2e2e4e", hp: 1.1,  speed: 1.1, rate: 1,   desc: "적 속도 +10% & 체력 +10%" },
];
function themeIndex()    { return Math.floor((Math.max(1, wave) - 1) / 10) % THEMES.length; }
function curTheme()      { return THEMES[themeIndex()]; }
function themeHpMult()   { return curTheme().hp; }
function themeSpeedMult(){ return curTheme().speed; }
function themeRateMult() { return curTheme().rate; }

// ============================================================
//  🎪 이벤트 웨이브 (웨이브 시작 시 10%, 보스 웨이브 제외) — Phase 2
// ============================================================
const EVENTS = {
  gold:     { icon: "💰", name: "골드 러시",   desc: "이번 웨이브 처치 골드 3배!",     color: "#ffd93d", border: "#ffd93d" },
  rush:     { icon: "🌊", name: "러시아워",    desc: "적 2배! 클리어 보너스 3배!",     color: "#ff8f8f", border: "#ff5555" },
  treasure: { icon: "🎁", name: "보물 슬라임", desc: "도망가기 전에 잡으면 무기 드랍!", color: "#7dffb2", border: "#7dffb2" },
};
const EVENT_KEYS = ["gold", "rush", "treasure"];

// ============================================================
//  👑 보스 패턴 3종 — 스폰 시 (wave/5) % 3 으로 로테이션 — Phase 2
// ============================================================
const BOSS_TYPES = [
  { key: "summoner", icon: "🔮", name: "소환사" },
  { key: "charger",  icon: "💨", name: "돌진왕" },
  { key: "chiller",  icon: "❄️", name: "빙결왕" },
];

// ============================================================
//  🎲 적 타입 룰렛 — 우선순위 순서대로 누적 확률 구간을 배정하므로 서로 겹치지 않는다
//  (웨이브 조건을 못 채운 타입은 구간을 아예 차지하지 않음)
// ============================================================
const ENEMY_ROLL = [
  { key: "fast",    minWave: 8,  p: 0.22 }, // 🏃 빠른 돌진형
  { key: "tank",    minWave: 6,  p: 0.12 }, // 🛡 탱커
  { key: "split",   minWave: 10, p: 0.12 }, // 🟢 분열형
  { key: "healer",  minWave: 12, p: 0.10 }, // 💚 힐러
  { key: "shield",  minWave: 14, p: 0.10 }, // 🛡️ 방패병
  { key: "ghost",   minWave: 16, p: 0.08 }, // 👻 유령
  { key: "balloon", minWave: 10, p: 0.10 }, // 🎈 풍선
];
function rollEnemyKind() {
  const roll = Math.random();
  let acc = 0;
  for (const t of ENEMY_ROLL) {
    if (wave < t.minWave) continue;   // 아직 안 나오는 타입은 구간을 차지하지 않는다
    acc += t.p;
    if (roll < acc) return t.key;
  }
  return "normal";
}

// ---------- 게임 상태 ----------
let state = "title";   // title | play | over | meta | dex | card
let grid, enemies, projectiles, particles, floats, effects;
let gold, lives, wave, buyCount, kills, upg, skills, peakTier;
let timeScale = 1;
let spawnQueue, spawnTimer, waveDelay, waveActive, unitTimer;
let waveEvent = null;  // 🎪 이번 웨이브의 이벤트 키 (없으면 null) — 웨이브 종료 시 해제
let chillLane = -1;    // ❄️ 빙결왕이 점거한 레인 (없으면 -1)
let shakeT = 0, flashT = 0, time = 0;
let drag = null;       // {idx, x, y}
let runBuffs = [];     // 🃏 이번 판에서 획득한 버프 카드 id 목록 (중첩 시 중복 저장)
let cardPick = null;   // 🃏 카드 선택 중: { cards:[], sel:-1, selT:0 }
let overSettled = false;   // ⭐ 결과 정산 완료 플래그 (중복 지급 방지)
let earnedShards = 0;      // 이번 판에서 얻은 별조각
let newRecord = false;     // 신기록 여부
let toast = null;          // 메뉴 화면용 안내 문구 { txt, color, until }
let best = (function () { const n = Number(lsGet("smd_best")); return (isFinite(n) && n > 0) ? Math.floor(n) : 0; })();

// 🃏 특정 버프의 중첩 수 (없으면 0)
function buffCount(id) {
  let n = 0;
  for (const b of runBuffs) if (b === id) n++;
  return n;
}
// 🃏 자주 쓰는 버프 배율 헬퍼
function aoeMult()     { return 1 + buffCount("aoe25") * 0.25; }
function burnDurMult() { return buffCount("burn2") ? 2 : 1; }
function jackChance()  { return 0.12 * (buffCount("jack2") ? 2 : 1); }
// ⏳ 메타 "스킬 단련" 적용 쿨다운
function skillCd(k) { return (k === "meteor" ? 30 : 25) * (1 - meta.cdr * 0.05); }

function reset() {
  grid = Array(ROWS * COLS).fill(null);
  enemies = []; projectiles = []; particles = []; floats = []; effects = [];
  gold = 150 + meta.gold * 50;          // ⭐ 메타: 시작 골드
  lives = 10 + meta.lives;              // ⭐ 메타: 생명
  wave = 0; buyCount = 0; kills = 0;
  upg = { dmg: 0, rate: 0, gold: 0 };
  skills = { meteor: 0, freeze: 0 };
  peakTier = 1;
  spawnQueue = 0; spawnTimer = 0; waveDelay = 2; waveActive = false; unitTimer = 0;
  waveEvent = null; chillLane = -1;      // 🎪/❄️ Phase 2 상태 초기화
  shakeT = 0; flashT = 0;
  runBuffs = []; cardPick = null;
  overSettled = false; earnedShards = 0; newRecord = false;
  drag = null;
  const st = Math.max(1, Math.min(MAX_TIER, 1 + meta.tier)); // ⭐ 메타: 시작 등급
  addUnit(st); addUnit(st);
}

function buyCost() { return Math.floor(30 * Math.pow(1.13, buyCount)); }
// 자동 무기 생성 주기 (웨이브가 오르면 조금씩 빨라짐 / 🃏 조달 계약으로 단축)
function unitInterval() {
  return Math.max(2.0, 3.2 - wave * 0.04) / (1 + buffCount("spawn20") * 0.2);
}
// 무기 판매 가격 (🃏 고물상: 2배)
function sellPrice(t) {
  return Math.floor(12 * Math.pow(1.9, t - 1) * (buffCount("sell2") ? 2 : 1));
}

// ---------- 업그레이드 ----------
function upgCost(k) {
  const lv = upg[k];
  if (k === "dmg")  return Math.floor(40 * Math.pow(1.4, lv));
  if (k === "rate") return Math.floor(60 * Math.pow(1.45, lv));
  return Math.floor(50 * Math.pow(1.5, lv));
}
// 🃏 마력 각성 / 광전사 / 황금손 버프가 각각 곱해진다
function dmgMult()  { return (1 + upg.dmg * 0.15)  * (1 + buffCount("dmg15") * 0.15); }
function rateMult() { return (1 + upg.rate * 0.10) * (1 + buffCount("atk10") * 0.10); }
function goldMult() { return (1 + upg.gold * 0.20) * (1 + buffCount("gold30") * 0.30); }

// 구매 무기 등급 뽑기: 확률 기반, 웨이브가 오르면 고등급 확률 상승
function rollBuyTier() {
  const lvl = Math.min(wave, 30);
  const weights = [
    Math.max(3, 34 - lvl * 1.3), // 1등급
    20,                          // 2등급
    12 + lvl * 0.5,              // 3등급
    9 + lvl * 0.4,               // 4등급
    3.5 + lvl * 0.2,             // 5등급
    3 + lvl * 0.15,              // 6등급
    2.75 + lvl * 0.13,           // 7등급
    2.25 + lvl * 0.1,            // 8등급
    1.5 + lvl * 0.08,            // 9등급
    2.2 + lvl * 0.05,            // 10등급 (웨이브1 ~2.5%)
  ];
  // ⭐ 메타 "행운": 6~10등급 구간 가중치 상승
  const luck = 1 + meta.luck * 0.08;
  for (let t = 5; t <= 9; t++) weights[t] *= luck;
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let t = 0; t < weights.length; t++) {
    r -= weights[t];
    if (r <= 0) return spawnTier(t + 1);
  }
  return spawnTier(1);
}
// 스마트 뽑기: 보유 최고 등급이 오르면 뽑기 등급대도 함께 상승
// (최고 등급 12 → 3~12등급대에서 뽑힘)
function spawnTier(offset) {
  const base = Math.max(1, peakTier - 9);
  return Math.min(MAX_TIER, base + offset - 1);
}

function addUnit(tier) {
  const empty = [];
  for (let i = 0; i < grid.length; i++) if (!grid[i]) empty.push(i);
  if (!empty.length) return false;
  const idx = empty[Math.floor(Math.random() * empty.length)];
  grid[idx] = { tier, cd: Math.random() * 0.5, pop: 1, recoil: 0 };
  peakTier = Math.max(peakTier, tier);
  discover(tier); // 📖 도감 등록
  return true;
}

// ---------- 유닛 능력치: 무기마다 고유한 공격 방식 ----------
// type: basic(단발) dagger(연속 찌르기) pierce(관통 화살) boomerang(왕복 부메랑)
//       spread(다중 타겟) slash(회전 대검+소범위) homing(유도 마법탄+폭발)
//       fire(화염 폭발+화상) chain(체인 라이트닝) star(별똥별 낙하)

  { type: "fire",      dmg: 5200,  rate: 0.95, speed: 600, aoe: 105, burn: 0.4 },
  { type: "chain",     dmg: 13500, rate: 1.0,  chains: 4 },
  { type: "star",      dmg: 22000, rate: 0.9,  speed: 780, count: 3, aoe: 88 },
  // 11~20등급: 합성으로만 얻는 초월 무기 — 각자 고유 메커니즘

  { type: "smash",     dmg: 330000,    rate: 1.0,  speed: 1300, aoe: 105 },                          // 13 골렘 주먹: 하늘에서 내리찍는 충격파
  { type: "fire",      dmg: 820000,    rate: 1.0,  speed: 620,  aoe: 135, burn: 0.5 },               // 14 메테오: 대폭발+화상
  { type: "wave",      dmg: 2100000,   rate: 1.0,  speed: 520 },                                     // 15 해일: 레인 전체 폭 물의 장벽

  { type: "blackhole", dmg: 5000000,   rate: 0.8,  speed: 560 },                                     // 18 블랙홀: 적을 빨아들이며 연속 타격
  { type: "pierce",    dmg: 82000000,  rate: 1.05, speed: 900,  wide: 46 },                          // 19 드래곤: 거대 관통 브레스
  { type: "judgment",  dmg: 205000000, rate: 0.9 },                                                  // 20 신의 심판: 레인 전체 즉시 심판 빔
];
// 큰 숫자 표기 (1.2K / 3.4M / 5.6B)
function fmt(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(n >= 1e10 ? 0 : 1) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M";
  if (n >= 1e4) return (n / 1e3).toFixed(0) + "K";
  return String(Math.ceil(n));
}

// ---------- 웨이브 ----------
function startWave() {
  wave++;
  waveActive = true;
  waveEvent = null;                       // 🎪 지난 웨이브 이벤트는 여기서도 확실히 해제
  spawnQueue = 9 + Math.floor(wave * 1.6);
  spawnTimer = 0.5;
  sfx.wave();
  floatText(W / 2, H / 2 - 130, wave % 5 === 0 ? "👑 보스 웨이브 " + wave : "웨이브 " + wave, "#fff", 30, 1.4);

  // 🌍 테마 전환 안내 (10웨이브 단위 진입 웨이브에서만)
  if ((wave - 1) % 10 === 0) {
    const th = curTheme();
    floatText(W / 2, H / 2 - 72, th.icon + " " + th.name + " 테마 돌입!", "#fff", 27, 2.4);
    floatText(W / 2, H / 2 - 38, th.desc, "#ffd93d", 18, 2.4);
  }

  // 🎪 이벤트 웨이브: 보스 웨이브 제외, 10% 확률, 서로 배타적으로 1종만
  if (wave % 5 !== 0 && Math.random() < 0.10) {
    waveEvent = EVENT_KEYS[Math.floor(Math.random() * EVENT_KEYS.length)];
    const ev = EVENTS[waveEvent];
    if (waveEvent === "rush") spawnQueue *= 2;        // 🌊 적 수 2배
    if (waveEvent === "treasure") spawnTreasure();    // 🎁 웨이브 중 1마리
    floatText(W / 2, H / 2 + 14, ev.icon + " " + ev.name + "!", ev.color, 30, 2.4);
    floatText(W / 2, H / 2 + 48, ev.desc, "#fff", 18, 2.4);
    sfx.merge();
  }
}
function enemyBaseHp() { return 26 * Math.pow(1.32, wave - 1); }

function spawnEnemy() {
  const isBoss = (wave % 5 === 0) && spawnQueue === 1; // 5의 배수 웨이브 마지막은 보스
  const kind = isBoss ? "boss" : rollEnemyKind();      // 🎲 서로 겹치지 않는 누적 확률 룰렛
  if (kind === "balloon") { spawnBalloonFlock(); return; } // 🎈 스폰 큐 1 소모로 무리 생성

  const isFast   = kind === "fast";    // 빠른 돌진형 (빨간 꽃)
  const isTank   = kind === "tank";    // 탱커 (파란 꽃)
  const isSplit  = kind === "split";   // 분열형 (초록 꽃)
  const isHealer = kind === "healer";  // 💚 힐러
  const isShield = kind === "shield";  // 🛡️ 방패병
  const isGhost  = kind === "ghost";   // 👻 유령

  let hp = enemyBaseHp() * (0.85 + Math.random() * 0.4);
  if (isBoss)   hp *= 17;
  if (isFast)   hp *= 0.55;
  if (isTank)   hp *= 2.6;
  if (isHealer) hp *= 0.8;
  if (isShield) hp *= 1.2;
  if (isGhost)  hp *= 0.7;
  hp = Math.max(1, Math.round(hp * themeHpMult()));   // 🌍 테마 기믹: 체력 곱연산

  const spd = (isBoss ? 17 : (isFast ? 50 : 28) + Math.random() * 15)
            * (isTank ? 0.55 : 1) * (isHealer ? 0.8 : 1) * (isGhost ? 1.1 : 1)
            * Math.pow(1.02, wave) * themeSpeedMult();  // 🌍 테마 기믹: 속도 곱연산

  const e = {
    x: 60 + Math.random() * (W - 120),
    y: FIELD_TOP - 40,
    hp, maxHp: hp,
    speed: spd,
    r: isBoss ? 46 : (isFast ? 20 : (isTank ? 34 : (isGhost ? 24 : 26 + Math.random() * 6))),
    boss: isBoss, fast: isFast, tank: isTank, split: isSplit,
    healer: isHealer, shield: isShield, ghost: isGhost, balloon: false, treasure: false,
    shieldHits: isShield ? 5 : 0,   // 🛡️ 첫 5회 타격 무효
    healT: isHealer ? 2 : 0,        // 💚 2초 주기 회복
    ghostT: isGhost ? 2 : 0,        // 👻 실체 2초 ↔ 무적 1.2초
    ghostInvuln: false,
    chargeT: 0,
    wob: Math.random() * Math.PI * 2,
    hitT: 0, burn: null, frozen: 0,
    flower: isFast ? "#ff6b6b" : isTank ? "#7ba8ff" : isSplit ? "#8fd14f"
          : isHealer ? "#4fd9a8" : isShield ? "#c0c8d8" : isGhost ? "#b8a8e8"
          : (Math.random() < 0.5 ? "#ffb7d5" : "#fff"),
  };
  if (isBoss) initBoss(e);
  enemies.push(e);
}

// 🎈 풍선: 한 번에 3~5마리가 묶음으로 내려온다 (체력 1 / 아주 빠름 / 작음)
function spawnBalloonFlock() {
  const n = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) {
    enemies.push({
      x: 45 + Math.random() * (W - 90),
      y: FIELD_TOP - 40 - i * 26,
      hp: 1, maxHp: 1,                                 // 아무 공격이든 1방
      speed: (28 + Math.random() * 15) * 1.9 * Math.pow(1.02, wave) * themeSpeedMult(),
      r: 26 * 0.7,
      boss: false, fast: false, tank: false, split: false,
      healer: false, shield: false, ghost: false, balloon: true, treasure: false,
      shieldHits: 0, healT: 0, ghostT: 0, ghostInvuln: false, chargeT: 0,
      wob: Math.random() * Math.PI * 2,
      hitT: 0, burn: null, frozen: 0,
      flower: "#ffd0e8",
    });
  }
}

// 🎁 보물 슬라임: 방어선으로 내려오지 않고 좌우로 도망다니다 8초 후 사라진다
function spawnTreasure() {
  const hp = Math.max(1, Math.round(enemyBaseHp() * 1.2 * themeHpMult()));
  const y = FIELD_TOP + 90 + Math.random() * 70;
  enemies.push({
    x: W / 2, y, homeY: y,
    hp, maxHp: hp,
    speed: 0, r: 24,
    boss: false, fast: false, tank: false, split: false,
    healer: false, shield: false, ghost: false, balloon: false, treasure: true,
    tvx: (Math.random() < 0.5 ? -1 : 1) * 200,  // 좌우 도주 속도
    tlife: 8,                                   // 8초 후 도주
    shieldHits: 0, healT: 0, ghostT: 0, ghostInvuln: false, chargeT: 0,
    wob: Math.random() * Math.PI * 2,
    hitT: 0, burn: null, frozen: 0,
    flower: "#ffd93d",
  });
}

// 👑 보스 패턴 배정 + 등장 연출
function initBoss(e) {
  const bt = BOSS_TYPES[Math.floor(wave / 5) % BOSS_TYPES.length];
  e.bossType = bt.key;
  e.summonT = 3;      // 소환사: 3초마다 소환
  e.chargeStage = 0;  // 돌진왕: 넘어선 체력 문턱 수
  floatText(W / 2, H / 2 - 92, "👑 " + bt.icon + " " + bt.name, "#ff8f8f", 30, 2);
  burst(e.x, e.y + 40, "#ff6b6b", 26, 200);
  shakeT = Math.max(shakeT, 0.3);
}

// 👑 소환사: 미니 슬라임 소환 (체력 = 보스 maxHp의 3%, 일반 적으로 취급)
function summonMinion(b, dir) {
  const mhp = Math.max(1, Math.round(b.maxHp * 0.03));
  enemies.push({
    x: Math.max(24, Math.min(W - 24, b.x + dir * 36)), y: b.y + 12,
    hp: mhp, maxHp: mhp,
    speed: (34 + Math.random() * 14) * Math.pow(1.02, wave) * themeSpeedMult(),
    r: 19,
    boss: false, fast: false, tank: false, split: false,
    healer: false, shield: false, ghost: false, balloon: false, treasure: false,
    shieldHits: 0, healT: 0, ghostT: 0, ghostInvuln: false, chargeT: 0,
    wob: Math.random() * Math.PI * 2,
    hitT: 0, burn: null, frozen: 0,
    flower: "#b04fd9",
  });
}

// 👑 보스 패턴 갱신 (빙결왕은 updateChillLane / laneRateMult 에서 처리)
function updateBoss(e, dt) {
  if (e.bossType === "summoner") {
    e.summonT -= dt;
    if (e.summonT <= 0) {
      e.summonT = 3;
      summonMinion(e, -1); summonMinion(e, 1);
      burst(e.x, e.y, "#b04fd9", 20, 170);
      floatText(e.x, e.y - e.r - 34, "🔮 소환!", "#d9a0ff", 20, 0.9);
      sfx.merge();
    }
  } else if (e.bossType === "charger") {
    // 체력이 75/50/25% 문턱을 넘길 때마다 1.2초 질주
    const TH = [0.75, 0.5, 0.25], ratio = e.hp / e.maxHp;
    while (e.chargeStage < TH.length && ratio <= TH[e.chargeStage]) {
      e.chargeStage++;
      e.chargeT = 1.2;
      shakeT = Math.max(shakeT, 0.45);
      floatText(e.x, e.y - e.r - 34, "💨 돌진!", "#ff6b6b", 24, 1);
      burst(e.x, e.y, "#ff6b6b", 18, 190);
      sfx.hurt();
    }
  }
  if (e.chargeT > 0) e.chargeT -= dt;
}

// ❄️ 빙결왕 오라: 보스가 선 레인(±1칸) 무기의 공속을 30% 깎는다
function updateChillLane() {
  chillLane = -1;
  for (const e of enemies) {
    if (e.boss && e.bossType === "chiller") {
      chillLane = Math.max(0, Math.min(COLS - 1, Math.floor(e.x / CELL)));
      break;
    }
  }
}
function isChilled(col) { return chillLane >= 0 && Math.abs(col - chillLane) <= 1; }
// 레인별 공속 배율: 🌍 테마 기믹 × ❄️ 빙결왕 오라
function laneRateMult(col) { return themeRateMult() * (isChilled(col) ? 0.7 : 1); }

// 💚 힐러: 반경 120 내의 다른 슬라임을 자기 maxHp의 8%만큼 회복
function healPulse(h) {
  const amount = h.maxHp * 0.08;
  let healed = 0;
  for (const o of enemies) {
    if (o === h || o.hp <= 0 || o.hp >= o.maxHp) continue;
    if (Math.hypot(o.x - h.x, o.y - h.y) > 120) continue;
    o.hp = Math.min(o.maxHp, o.hp + amount);
    healed++;
    floatText(o.x, o.y - o.r - 8, "+" + fmt(amount), "#4fd9a8", 15, 0.7);
    burst(o.x, o.y, "#4fd9a8", 6, 100);
  }
  if (healed) effects.push({ type: "ring", x: h.x, y: h.y, maxR: 120, life: 0.4, t: 0, color: "#4fd9a8" });
}

// 처치 골드 (🎈 풍선 0.4배 / 💰 골드 러시 3배)
function killGold(e) {
  const kindMult = e.boss ? 10 : e.mini ? 0.5 : e.balloon ? 0.4 : 1;
  const eventMult = waveEvent === "gold" ? 3 : 1;
  return Math.max(2, Math.floor((5 + wave * 2) * kindMult * goldMult() * eventMult));
}

// ---------- 데미지 & 처치 (모든 공격이 공유) ----------
function killEnemy(e) {
  const gi = enemies.indexOf(e);
  if (gi < 0) return;
  enemies.splice(gi, 1);
  const g = killGold(e);
  gold += g; kills++;
  floatText(e.x, e.y - e.r - 10, "+" + g, "#ffd93d", 18);
  burst(e.x, e.y, "#c9d94f", e.boss ? 40 : 14, e.boss ? 220 : 130);
  sfx.kill();
  // 👑 보스 보상: 최고 등급 -1 무기 드랍 (칸이 없으면 골드)
  if (e.boss) {
    const t = Math.max(1, Math.min(MAX_TIER, peakTier - 1));
    if (addUnit(t)) {
      floatText(W / 2, H / 2 - 60, "👑 보스 보상! " + t + "등급 " + TIER_NAME[t - 1] + "!", "#ffd93d", 26, 1.8);
      burst(W / 2, H / 2 - 60, "#ffd93d", 30, 220);
      sfx.wave();
    } else {
      const bg = Math.floor(150 * (1 + wave / 4) * goldMult());
      gold += bg;
      floatText(W / 2, H / 2 - 60, "👑 보스 보상! +" + fmt(bg) + "💰", "#ffd93d", 26, 1.8);
    }
  }
  // 🎁 보물 슬라임 보상: 최고 등급 -2 무기 드랍 (최소 1등급 / 칸이 없으면 골드)
  if (e.treasure) {
    const t = Math.max(1, Math.min(MAX_TIER, peakTier - 2));
    if (addUnit(t)) {
      floatText(W / 2, H / 2 - 60, "🎁 보물! " + t + "등급 " + TIER_NAME[t - 1] + "!", "#7dffb2", 26, 1.8);
      burst(W / 2, H / 2 - 60, "#7dffb2", 30, 220);
      sfx.wave();
    } else {
      const bg = Math.floor(120 * (1 + wave / 4) * goldMult());
      gold += bg;
      floatText(W / 2, H / 2 - 60, "🎁 보물! +" + fmt(bg) + "💰", "#7dffb2", 26, 1.8);
    }
  }
  // 분열형: 죽으면 미니 슬라임 2마리로 쪼개짐
  if (e.split) {
    for (let k = -1; k <= 1; k += 2) {
      const mhp = Math.max(1, Math.round(e.maxHp * 0.35));
      enemies.push({
        x: Math.max(20, Math.min(W - 20, e.x + k * 20)), y: e.y,
        hp: mhp, maxHp: mhp,
        speed: e.speed * 1.35, r: Math.max(14, e.r * 0.68),
        boss: false, fast: false, tank: false, split: false, mini: true,
        healer: false, shield: false, ghost: false, balloon: false, treasure: false,
        shieldHits: 0, healT: 0, ghostT: 0, ghostInvuln: false, chargeT: 0,
        wob: Math.random() * Math.PI * 2, hitT: 0, burn: null, frozen: 0,
        flower: "#8fd14f",
      });
    }
  }
}
// silent = 화상 등 지속 피해 (타격 판정이 아니므로 방패를 소모하지 않고 관통한다)
function damageEnemy(e, dmg, silent) {
  if (e.hp <= 0 || enemies.indexOf(e) === -1) return;
  // 👻 유령: 무적 위상 동안 모든 데미지 무효 (화상 포함)
  if (e.ghostInvuln) {
    if (!silent) {
      e.hitT = 0;
      floatText(e.x, e.y - e.r - 8, "무효", "#b8a8e8", 16, 0.6);
      burst(e.x, e.y, "#b8a8e8", 4, 80);
    }
    return;
  }
  // 🛡️ 방패병: 첫 5회 "타격"을 무효화 (지속 피해는 그대로 통과)
  if (e.shieldHits > 0 && !silent) {
    e.shieldHits--;
    e.hitT = 0.12;
    floatText(e.x, e.y - e.r - 8, "막음!", "#dfe4ee", 17, 0.7);
    burst(e.x, e.y - e.r * 0.3, "#c0c8d8", 7, 120);
    sfx.error();
    return;
  }
  e.hp -= dmg;
  if (!silent) e.hitT = 0.12;
  if (e.hp <= 0) killEnemy(e);
}
// 범위 폭발 데미지 (🃏 폭심지: 반경 +25% / 🃏 겁화: 화상 지속 2배)
function aoeDamage(x, y, r, dmg, tier, burn) {
  r = r * aoeMult();
  effects.push({ type: "ring", x, y, maxR: r, life: 0.3, t: 0, color: TIER_COLOR[tier - 1] });
  burst(x, y, TIER_COLOR[tier - 1], 14, 160);
  for (const e of [...enemies]) {
    if (Math.hypot(e.x - x, e.y - y) <= r + e.r) {
      if (burn) e.burn = { dps: dmg * burn / 3, t: 3 * burnDurMult() };
      damageEnemy(e, dmg);
    }
  }
}
// 체인 라이트닝: 가장 앞의 적에서 근처 적으로 튕김 (🃏 전도체: chains 증가)
function chainLightning(c, first, atk, baseDmg, chains) {
  const pts = [{ x: c.x, y: c.y - 20 }];
  const hit = new Set();
  let cur = first, dmg = baseDmg;
  for (let i = 0; i < chains && cur; i++) {
    // 번개가 지그재그로 보이도록 중간점 추가
    const prev = pts[pts.length - 1];
    for (let k = 1; k <= 3; k++) {
      pts.push({ x: prev.x + (cur.x - prev.x) * k / 4 + (Math.random() - 0.5) * 26, y: prev.y + (cur.y - prev.y) * k / 4 + (Math.random() - 0.5) * 26 });
    }
    pts.push({ x: cur.x, y: cur.y });
    hit.add(cur);
    burst(cur.x, cur.y, "#ffe97a", 8, 120);
    damageEnemy(cur, Math.round(dmg));
    dmg *= 0.72;
    let next = null, nd = 150;
    for (const e of enemies) {
      if (hit.has(e) || e.y < FIELD_TOP - 10) continue;
      const d = Math.hypot(e.x - cur.x, e.y - cur.y);
      if (d < nd) { nd = d; next = e; }
    }
    cur = next;
  }
  effects.push({ type: "bolt", pts, life: 0.16, t: 0, w: atk.chains >= 6 ? 12 : 7 });
}
// 자기 열(레인) 앞의 적만, 방어선에 가까운 순서로 최대 n마리
const LANE_MARGIN = 24; // 레인 폭 여유 (옆 칸 경계에 걸친 적도 커버)
function laneEnemies(col, n) {
  const left = col * CELL - LANE_MARGIN, right = (col + 1) * CELL + LANE_MARGIN;
  return enemies
    .filter(e => e.y > FIELD_TOP - 10 && e.x >= left && e.x <= right)
    .sort((a, b) => b.y - a.y)
    .slice(0, n);
}
// 무기 발사: 종류별로 완전히 다른 공격
function fireWeapon(tier, c, targets) {
  const atk = ATTACK[tier - 1], main = targets[0];
  let dmg = Math.round(atk.dmg * dmgMult()); // ⚔️ 공격력 업그레이드 + 🃏 마력 각성
  // 🃏 관통의 극의: 관통(pierce)·해일(wave) 계열 데미지 +40% (중첩)
  if (atk.type === "pierce" || atk.type === "wave") dmg = Math.round(dmg * (1 + buffCount("pierce40") * 0.4));
  sfx.shoot();
  switch (atk.type) {
    case "chain":
      chainLightning(c, main, atk, dmg, atk.chains + buffCount("chain2") * 2); // 🃏 전도체
      break;
    case "star": // 별똥별: 하늘에서 낙하 후 폭발
      for (const tg of targets)
        projectiles.push({ kind: "star", x: tg.x + (Math.random() - 0.5) * 80, y: tg.y - 340, tx: tg.x, ty: tg.y, speed: atk.speed, dmg, tier, aoe: atk.aoe, rot: Math.random() * 6 });
      break;
    case "pierce": { // 관통 화살/드래곤 브레스: 직선으로 끝까지
      const dx = main.x - c.x, dy = main.y - (c.y - 20), d = Math.hypot(dx, dy) || 1;
      projectiles.push({ kind: "pierce", x: c.x, y: c.y - 20, vx: dx / d * atk.speed, vy: dy / d * atk.speed, dmg, tier, wide: atk.wide || 0, hitSet: new Set(), rot: Math.atan2(dy, dx) + Math.PI / 2 });
      break;
    }
    case "tornado": // 회오리: 레인 바닥에서 생성돼 위로 쓸고 올라감
      projectiles.push({ kind: "tornado", x: c.x, y: GRID_TOP - 50, dmg, tier, speed: atk.speed, tick: 0, rot: 0 });
      break;
    case "smash": // 골렘 주먹: 가장 앞의 적 머리 위에서 내리찍기
      projectiles.push({ kind: "smash", x: main.x, y: main.y - 320, tx: main.x, ty: main.y, speed: atk.speed, dmg, tier, aoe: atk.aoe, rot: 0 });
      break;
    case "wave": { // 해일: 레인 폭 전체를 쓸어올리는 물의 장벽
      const col = Math.max(0, Math.min(COLS - 1, Math.floor(c.x / CELL)));
      projectiles.push({ kind: "wave", left: col * CELL - LANE_MARGIN, right: (col + 1) * CELL + LANE_MARGIN, y: GRID_TOP - 40, speed: atk.speed, dmg, tier, hitSet: new Set(), wob: 0 });
      break;
    }
    case "eruption": // 화산: 용암탄이 레인의 적들 위로 낙하
      for (const tg of targets)
        projectiles.push({ kind: "star", sub: "lava", x: tg.x + (Math.random() - 0.5) * 60, y: tg.y - 340, tx: tg.x, ty: tg.y, speed: atk.speed, dmg, tier, aoe: atk.aoe, burn: atk.burn, rot: Math.random() * 6 });
      break;
    case "blackhole": // 블랙홀: 도착 지점에서 적을 빨아들이며 연속 피해
      projectiles.push({ kind: "blackhole", x: c.x, y: c.y - 20, tx: main.x, ty: main.y - 20, speed: atk.speed, dmg, tier, phase: 0, life: 1.6, tick: 0, rot: 0 });
      break;
    case "judgment": { // 신의 심판: 레인 전체 즉시 소멸 빔
      const col = Math.max(0, Math.min(COLS - 1, Math.floor(c.x / CELL)));
      const left = col * CELL - LANE_MARGIN, right = (col + 1) * CELL + LANE_MARGIN;
      for (const e of [...enemies])
        if (e.x >= left && e.x <= right && e.y > FIELD_TOP - 30) damageEnemy(e, dmg);
      effects.push({ type: "beam", left, right, life: 0.45, t: 0 });
      shakeT = 0.3;
      sfx.wave();
      break;
    }
    case "boomerang": // 부메랑: 갔다가 돌아오며 경로의 적 모두 타격
      projectiles.push({ kind: "boom", x: c.x, y: c.y - 20, ox: c.x, oy: c.y - 20, tx: main.x, ty: main.y - 30, phase: 0, speed: atk.speed, dmg, tier, hitSet: new Set(), rot: 0 });
      break;
    case "spread": // 삼지창: 서로 다른 적 3마리 동시 공격
      for (const tg of targets)
        projectiles.push({ kind: "homing", sub: "trident", target: tg, x: c.x, y: c.y - 20, speed: atk.speed, dmg, tier, aoe: 0, burn: 0, rot: 0 });
      break;
    default: // basic / dagger / slash / homing / fire
      projectiles.push({ kind: "homing", sub: atk.type, target: main, x: c.x, y: c.y - 20, speed: atk.speed, dmg, tier, aoe: atk.aoe || 0, burn: atk.burn || 0, rot: 0, spin: 0 });
  }
}

  const lv = meta[it.key] || 0;
  if (lv >= it.max) { toastMsg("이미 최대 레벨!", "#ffd93d"); sfx.error(); return; }

  if (shards < cost) { toastMsg("별조각이 부족해요!", "#ff8f8f"); sfx.error(); return; }
  shards -= cost;
  meta[it.key] = lv + 1;
  saveMeta(); saveShards();
  toastMsg(it.icon + " " + it.name + " Lv" + meta[it.key] + " 달성!", "#7dffb2");
  sfx.merge();
}
// 메뉴 화면 안내 문구 (time 기준 — 일시정지 상태에서도 흐름)
function toastMsg(txt, color) { toast = { txt, color: color || "#fff", until: time + 1.6 }; }

function inBtn(p, b) { return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h; }
function slotAt(p) {
  if (p.y < GRID_TOP || p.y > GRID_TOP + ROWS * (CELL - 8)) return -1;
  const c = Math.floor(p.x / CELL);
  const r = Math.floor((p.y - GRID_TOP) / (CELL - 8));
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return -1;
  return r * COLS + c;
}

function onDown(e) {
  e.preventDefault();
  const p = ptFromEvent(e);
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();

  // ---- 타이틀: 영구 강화 / 도감 버튼, 그 외 영역은 게임 시작 ----
  if (state === "title") {
    if (inBtn(p, TITLE_BTN.meta)) { state = "meta"; toast = null; sfx.buy(); return; }
    if (inBtn(p, TITLE_BTN.dex))  { state = "dex";  toast = null; sfx.buy(); return; }
    state = "play"; reset(); sfx.wave(); return;
  }
  // ---- ⭐ 메타 상점 ----
  if (state === "meta") {
    if (inBtn(p, BACK_BTN)) { state = "title"; sfx.buy(); return; }
    for (let i = 0; i < META_ITEMS.length; i++) if (inBtn(p, metaBuyRect(i))) { buyMeta(i); return; }
    return;
  }
  // ---- 📖 도감 ----
  if (state === "dex") {
    if (inBtn(p, BACK_BTN)) { state = "title"; sfx.buy(); }
    return;
  }
  // ---- 🃏 버프 카드 선택 ----
  if (state === "card") {
    if (!cardPick) { state = "play"; return; }
    for (let i = 0; i < cardPick.cards.length; i++) if (inBtn(p, cardRect(i))) { pickCard(i); return; }
    return;
  }
  // ---- 결과 화면: 다시 시작 / 타이틀로 ----
  if (state === "over") {
    if (inBtn(p, OVER_BTN.again)) { reset(); state = "play"; sfx.wave(); return; }
    if (inBtn(p, OVER_BTN.title)) { state = "title"; return; }
    return;
  }

  if (inBtn(p, BTN.sound)) { soundOn = !soundOn; return; }
  if (inBtn(p, BTN.speed)) { timeScale = timeScale === 1 ? 2 : 1; return; }
  for (const sb of SKILL_BTNS) {
    if (Math.hypot(p.x - sb.x, p.y - sb.y) <= sb.r + 8) { useSkill(sb.key); return; }
  }
  if (inBtn(p, BTN.buy)) {
    if (gold >= buyCost()) {
      const t = rollBuyTier();
      if (addUnit(t)) {
        gold -= buyCost(); buyCount++; sfx.buy();
        if (t >= 6) { // 초대박 당첨 연출
          floatText(W / 2, H / 2 - 100, "🎊 초대박! " + t + "등급 " + TIER_NAME[t - 1] + "!! 🎊", "#ffd93d", 30, 2);
          burst(W / 2, H / 2 - 100, TIER_COLOR[t - 1], 50, 260);
          shakeT = 0.3;
          sfx.wave();
        } else if (t >= 3) { // 고등급 당첨 연출
          floatText(BTN.buy.x + BTN.buy.w / 2, BTN.buy.y - 12, "🎉 " + t + "등급 " + TIER_NAME[t - 1] + "!", TIER_COLOR[t - 1], 21, 1.3);
          sfx.merge();
        }
      }
      else { floatText(BTN.buy.x + BTN.buy.w / 2, BTN.buy.y - 10, "칸이 가득 찼어요!", "#ffd93d", 18); sfx.error(); }
    } else { floatText(BTN.buy.x + BTN.buy.w / 2, BTN.buy.y - 10, "골드 부족!", "#ff6b6b", 18); sfx.error(); }
    return;
  }
  // 업그레이드 구매
  for (const b of BTN.upg) {
    if (inBtn(p, b)) {
      const cost = upgCost(b.key);
      if (gold >= cost) {
        gold -= cost; upg[b.key]++;
        sfx.merge();
        burst(b.x + b.w / 2, b.y + b.h / 2, "#7dffb2", 12, 130);
        floatText(b.x + b.w / 2, b.y - 12, b.icon + " " + b.label + " Lv" + upg[b.key], "#7dffb2", 17, 1.1);
      } else { floatText(b.x + b.w / 2, b.y - 12, "골드 부족!", "#ff6b6b", 16); sfx.error(); }
      return;
    }
  }
  const idx = slotAt(p);
  if (idx >= 0 && grid[idx]) drag = { idx, x: p.x, y: p.y };
}
function onMove(e) {
  e.preventDefault();
  if (!drag) return;
  if (state !== "play") { drag = null; return; }
  const p = ptFromEvent(e);
  drag.x = p.x; drag.y = p.y;
}
function onUp(e) {
  e.preventDefault();
  if (!drag) return;
  if (state !== "play") { drag = null; return; } // 드래그 도중 상태가 바뀌면 취소
  // 🗑️ 판매 존에 놓으면 판매
  if (grid[drag.idx] && Math.hypot(drag.x - TRASH.x, drag.y - TRASH.y) <= TRASH.r + 12) {
    const u = grid[drag.idx];
    const price = sellPrice(u.tier);
    gold += price;
    grid[drag.idx] = null;
    floatText(TRASH.x + 60, TRASH.y, "판매 +" + fmt(price) + "💰", "#ffd93d", 19, 1.1);
    burst(TRASH.x, TRASH.y, TIER_COLOR[u.tier - 1], 14, 140);
    sfx.buy();
    drag = null;
    return;
  }
  const to = slotAt({ x: drag.x, y: drag.y });
  const from = drag.idx;
  if (to >= 0 && to !== from && grid[from]) {
    const a = grid[from], b = grid[to];
    if (!b) { grid[to] = a; grid[from] = null; }                       // 이동
    else if (b.tier === a.tier && a.tier < MAX_TIER) {                 // 합성!
      let nt = a.tier + 1, jackpot = false;
      // 🎉 12% 확률 2단계 점프 (🃏 대박 체질이면 24%)
      if (nt < MAX_TIER && Math.random() < jackChance()) { nt++; jackpot = true; }
      grid[to] = { tier: nt, cd: 0, pop: 1, recoil: 0 };
      grid[from] = null;
      peakTier = Math.max(peakTier, nt);
      discover(nt); // 📖 도감 등록
      const c = cellCenter(to);
      burst(c.x, c.y, TIER_COLOR[nt - 1], jackpot ? 44 : 24, jackpot ? 240 : 160);
      floatText(c.x, c.y - 40, (jackpot ? "🎉 대박! " : "") + TIER_NAME[nt - 1] + " 획득!", jackpot ? "#ffd93d" : TIER_COLOR[nt - 1], jackpot ? 24 : 20, 1.2);
      sfx.merge();
    } else if (b.tier === a.tier && a.tier >= MAX_TIER) {
      floatText(drag.x, drag.y - 30, "최고 등급!", "#ffd93d", 18); sfx.error();
    } else { grid[to] = a; grid[from] = b; }                           // 교환
  }
  drag = null;
}
