<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>슬라임 머지 디펜스</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #2a3d1f;
    overflow: hidden;
    touch-action: none;
    font-family: 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; border-radius: 8px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
"use strict";
// ============================================================
//  슬라임 머지 디펜스 — Merge Defense Game
//  같은 무기를 합쳐서 강화하고, 몰려오는 슬라임을 막아내세요!
// ============================================================

const W = 480, H = 840;
const COLS = 5, ROWS = 3;
const GRID_TOP = H - 300;          // 격자판 시작 y
const CELL = W / COLS;             // 96
const FIELD_TOP = 70;              // 전장 시작 y (HUD 아래)
const MAX_TIER = 20;

const TIER_EMOJI = ["⛏️","🗡️","🏹","🪃","🔱","⚔️","🪄","🔥","⚡","🌟","💫","🌪️","🗿","☄️","🌊","🌩️","🌋","🌀","🐉","🌈"];
const TIER_COLOR = ["#9b7bd8","#8fd14f","#e8a33d","#d97b4f","#4fb7d9","#d94f6b","#b04fd9","#ff7b2e","#ffd93d","#7dffb2",
                    "#9ad8ff","#7ee0c3","#a58b6f","#ff6b3d","#3d9bff","#ffe14f","#e0443d","#7b5cff","#3dd96b","#ff9be0"];
const TIER_NAME  = ["곡괭이","단검","활","부메랑","삼지창","대검","마법지팡이","화염","번개","별의 힘",
                    "혜성","회오리","골렘 주먹","메테오","해일","뇌신","화산","블랙홀","드래곤","신의 심판"];

// ---------- 캔버스 & 스케일 ----------
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
function fit() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = W * scale + "px";
  canvas.style.height = H * scale + "px";
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", fit);
fit();

function ptFromEvent(e) {
  const r = canvas.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX);
  const cy = (e.touches ? e.touches[0].clientY : e.clientY);
  return { x: (cx - r.left) / r.width * W, y: (cy - r.top) / r.height * H };
}

// ---------- 사운드 (WebAudio) ----------
let audioCtx = null, soundOn = true;
function beep(freq, dur, type, vol, slide) {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, audioCtx.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.04, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  shoot: () => beep(700, 0.06, "square", 0.015, 400),
  hit:   () => beep(250, 0.05, "triangle", 0.03),
  kill:  () => beep(500, 0.15, "triangle", 0.04, 900),
  merge: () => { beep(400, 0.1, "square", 0.04, 800); setTimeout(() => beep(800, 0.15, "square", 0.04, 1200), 80); },
  buy:   () => beep(600, 0.08, "sine", 0.05, 750),
  hurt:  () => beep(150, 0.3, "sawtooth", 0.06, 60),
  wave:  () => { beep(523, 0.12, "square", 0.04); setTimeout(() => beep(659, 0.12, "square", 0.04), 120); setTimeout(() => beep(784, 0.2, "square", 0.04), 240); },
  error: () => beep(180, 0.12, "sawtooth", 0.04),
};

// ---------- 게임 상태 ----------
let state = "title";   // title | play | over
let grid, enemies, projectiles, particles, floats, effects;
let gold, lives, wave, buyCount, kills, upg, skills, peakTier;
let timeScale = 1;
let spawnQueue, spawnTimer, waveDelay, waveActive, unitTimer;
let shakeT = 0, flashT = 0, time = 0;
let drag = null;       // {idx, x, y}
let best = +(localStorage.getItem("smd_best") || 0);

function reset() {
  grid = Array(ROWS * COLS).fill(null);
  enemies = []; projectiles = []; particles = []; floats = []; effects = [];
  gold = 150; lives = 10; wave = 0; buyCount = 0; kills = 0;
  upg = { dmg: 0, rate: 0, gold: 0 };
  skills = { meteor: 0, freeze: 0 };
  peakTier = 1;
  spawnQueue = 0; spawnTimer = 0; waveDelay = 2; waveActive = false; unitTimer = 0;
  shakeT = 0; flashT = 0;
  addUnit(1); addUnit(1);
}

function buyCost() { return Math.floor(30 * Math.pow(1.13, buyCount)); }
// 자동 무기 생성 주기 (웨이브가 오르면 조금씩 빨라짐)
function unitInterval() { return Math.max(2.0, 3.2 - wave * 0.04); }
// 무기 판매 가격
function sellPrice(t) { return Math.floor(12 * Math.pow(1.9, t - 1)); }

// ---------- 업그레이드 ----------
function upgCost(k) {
  const lv = upg[k];
  if (k === "dmg")  return Math.floor(40 * Math.pow(1.4, lv));
  if (k === "rate") return Math.floor(60 * Math.pow(1.45, lv));
  return Math.floor(50 * Math.pow(1.5, lv));
}
function dmgMult()  { return 1 + upg.dmg * 0.15; }
function rateMult() { return 1 + upg.rate * 0.10; }
function goldMult() { return 1 + upg.gold * 0.20; }

// 구매 무기 등급 뽑기: 확률 기반, 웨이브가 오르면 고등급 확률 상승
function rollBuyTier() {
  const lvl = Math.min(wave, 30);
  const weights = [
    Math.max(3, 34 - lvl * 1.3), // 1등급
    20,                          // 2등급
    12 + lvl * 0.5,              // 3등급
    9 + lvl * 0.4,               // 4등급
    3.5 + lvl * 0.2,             // 5등급
    3 + lvl * 0.15,              // 6등급
    2.75 + lvl * 0.13,           // 7등급
    2.25 + lvl * 0.1,            // 8등급
    1.5 + lvl * 0.08,            // 9등급
    2.2 + lvl * 0.05,            // 10등급 (웨이브1 ~2.5%)
  ];
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let t = 0; t < weights.length; t++) {
    r -= weights[t];
    if (r <= 0) return spawnTier(t + 1);
  }
  return spawnTier(1);
}
// 스마트 뽑기: 보유 최고 등급이 오르면 뽑기 등급대도 함께 상승
// (최고 등급 12 → 3~12등급대에서 뽑힘)
function spawnTier(offset) {
  const base = Math.max(1, peakTier - 9);
  return Math.min(MAX_TIER, base + offset - 1);
}

function addUnit(tier) {
  const empty = [];
  for (let i = 0; i < grid.length; i++) if (!grid[i]) empty.push(i);
  if (!empty.length) return false;
  const idx = empty[Math.floor(Math.random() * empty.length)];
  grid[idx] = { tier, cd: Math.random() * 0.5, pop: 1, recoil: 0 };
  peakTier = Math.max(peakTier, tier);
  return true;
}

// ---------- 유닛 능력치: 무기마다 고유한 공격 방식 ----------
// type: basic(단발) dagger(연속 찌르기) pierce(관통 화살) boomerang(왕복 부메랑)
//       spread(다중 타겟) slash(회전 대검+소범위) homing(유도 마법탄+폭발)
//       fire(화염 폭발+화상) chain(체인 라이트닝) star(별똥별 낙하)
const ATTACK = [
  { type: "basic",     dmg: 10,    rate: 1.0,  speed: 620 },
  { type: "dagger",    dmg: 11,    rate: 2.3,  speed: 850 },
  { type: "pierce",    dmg: 52,    rate: 1.15, speed: 950 },
  { type: "boomerang", dmg: 58,    rate: 0.9,  speed: 540 },
  { type: "spread",    dmg: 125,   rate: 1.15, speed: 700, count: 3 },
  { type: "slash",     dmg: 900,   rate: 1.0,  speed: 640, aoe: 62 },
  { type: "homing",    dmg: 2300,  rate: 1.0,  speed: 560, aoe: 72 },
  { type: "fire",      dmg: 5200,  rate: 0.95, speed: 600, aoe: 105, burn: 0.4 },
  { type: "chain",     dmg: 13500, rate: 1.0,  chains: 4 },
  { type: "star",      dmg: 22000, rate: 0.9,  speed: 780, count: 3, aoe: 88 },
  // 11~20등급: 합성으로만 얻는 초월 무기 — 각자 고유 메커니즘
  { type: "star",      dmg: 55000,     rate: 1.0,  speed: 820,  count: 4, aoe: 95 },                 // 11 혜성: 별똥별 4발
  { type: "tornado",   dmg: 30000,     rate: 0.8,  speed: 150 },                                     // 12 회오리: 레인을 쓸고 올라가며 연속 타격+끌어당김
  { type: "smash",     dmg: 330000,    rate: 1.0,  speed: 1300, aoe: 105 },                          // 13 골렘 주먹: 하늘에서 내리찍는 충격파
  { type: "fire",      dmg: 820000,    rate: 1.0,  speed: 620,  aoe: 135, burn: 0.5 },               // 14 메테오: 대폭발+화상
  { type: "wave",      dmg: 2100000,   rate: 1.0,  speed: 520 },                                     // 15 해일: 레인 전체 폭 물의 장벽
  { type: "chain",     dmg: 5200000,   rate: 1.0,  chains: 6 },                                      // 16 뇌신: 6연쇄 굵은 번개
  { type: "eruption",  dmg: 4500000,   rate: 0.9,  speed: 820,  count: 4, aoe: 90, burn: 0.6 },      // 17 화산: 용암탄 4발 낙하+화상
  { type: "blackhole", dmg: 5000000,   rate: 0.8,  speed: 560 },                                     // 18 블랙홀: 적을 빨아들이며 연속 타격
  { type: "pierce",    dmg: 82000000,  rate: 1.05, speed: 900,  wide: 46 },                          // 19 드래곤: 거대 관통 브레스
  { type: "judgment",  dmg: 205000000, rate: 0.9 },                                                  // 20 신의 심판: 레인 전체 즉시 심판 빔
];
// 큰 숫자 표기 (1.2K / 3.4M / 5.6B)
function fmt(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(n >= 1e10 ? 0 : 1) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M";
  if (n >= 1e4) return (n / 1e3).toFixed(0) + "K";
  return String(Math.ceil(n));
}

// ---------- 웨이브 ----------
function startWave() {
  wave++;
  waveActive = true;
  spawnQueue = 9 + Math.floor(wave * 1.6);
  spawnTimer = 0.5;
  sfx.wave();
  floatText(W / 2, H / 2 - 120, wave % 5 === 0 ? "👑 보스 웨이브 " + wave : "웨이브 " + wave, "#fff", 30, 1.4);
}
function enemyBaseHp() { return 26 * Math.pow(1.32, wave - 1); }

function spawnEnemy() {
  const isBoss = (wave % 5 === 0) && spawnQueue === 1; // 5의 배수 웨이브 마지막은 보스
  const roll = Math.random();
  const isFast  = !isBoss && wave >= 8 && roll < 0.22;                     // 빠른 돌진형 (빨간 꽃)
  const isTank  = !isBoss && wave >= 6 && roll >= 0.18 && roll < 0.30;     // 탱커 (파란 꽃)
  const isSplit = !isBoss && wave >= 10 && roll >= 0.30 && roll < 0.42;    // 분열형 (초록 꽃)
  let hp = enemyBaseHp() * (0.85 + Math.random() * 0.4);
  if (isBoss) hp *= 17;
  if (isFast) hp *= 0.55;
  if (isTank) hp *= 2.6;
  hp = Math.round(hp);
  enemies.push({
    x: 60 + Math.random() * (W - 120),
    y: FIELD_TOP - 40,
    hp, maxHp: hp,
    speed: (isBoss ? 17 : (isFast ? 50 : 28) + Math.random() * 15) * (isTank ? 0.55 : 1) * Math.pow(1.02, wave),
    r: isBoss ? 46 : (isFast ? 20 : (isTank ? 34 : 26 + Math.random() * 6)),
    boss: isBoss, fast: isFast, tank: isTank, split: isSplit,
    wob: Math.random() * Math.PI * 2,
    hitT: 0, burn: null, frozen: 0,
    flower: isFast ? "#ff6b6b" : isTank ? "#7ba8ff" : isSplit ? "#8fd14f" : (Math.random() < 0.5 ? "#ffb7d5" : "#fff"),
  });
}

function killGold(e) { return Math.max(2, Math.floor((5 + wave * 2) * (e.boss ? 10 : e.mini ? 0.5 : 1) * goldMult())); }

// ---------- 데미지 & 처치 (모든 공격이 공유) ----------
function killEnemy(e) {
  const gi = enemies.indexOf(e);
  if (gi < 0) return;
  enemies.splice(gi, 1);
  const g = killGold(e);
  gold += g; kills++;
  floatText(e.x, e.y - e.r - 10, "+" + g, "#ffd93d", 18);
  burst(e.x, e.y, "#c9d94f", e.boss ? 40 : 14, e.boss ? 220 : 130);
  sfx.kill();
  // 👑 보스 보상: 최고 등급 -1 무기 드랍 (칸이 없으면 골드)
  if (e.boss) {
    const t = Math.max(1, Math.min(MAX_TIER, peakTier - 1));
    if (addUnit(t)) {
      floatText(W / 2, H / 2 - 60, "👑 보스 보상! " + t + "등급 " + TIER_NAME[t - 1] + "!", "#ffd93d", 26, 1.8);
      burst(W / 2, H / 2 - 60, "#ffd93d", 30, 220);
      sfx.wave();
    } else {
      const bg = Math.floor(150 * (1 + wave / 4) * goldMult());
      gold += bg;
      floatText(W / 2, H / 2 - 60, "👑 보스 보상! +" + fmt(bg) + "💰", "#ffd93d", 26, 1.8);
    }
  }
  // 분열형: 죽으면 미니 슬라임 2마리로 쪼개짐
  if (e.split) {
    for (let k = -1; k <= 1; k += 2) {
      const mhp = Math.max(1, Math.round(e.maxHp * 0.35));
      enemies.push({
        x: Math.max(20, Math.min(W - 20, e.x + k * 20)), y: e.y,
        hp: mhp, maxHp: mhp,
        speed: e.speed * 1.35, r: Math.max(14, e.r * 0.68),
        boss: false, fast: false, tank: false, split: false, mini: true,
        wob: Math.random() * Math.PI * 2, hitT: 0, burn: null, frozen: 0,
        flower: "#8fd14f",
      });
    }
  }
}
function damageEnemy(e, dmg, silent) {
  if (e.hp <= 0 || enemies.indexOf(e) === -1) return;
  e.hp -= dmg;
  if (!silent) e.hitT = 0.12;
  if (e.hp <= 0) killEnemy(e);
}
// 범위 폭발 데미지
function aoeDamage(x, y, r, dmg, tier, burn) {
  effects.push({ type: "ring", x, y, maxR: r, life: 0.3, t: 0, color: TIER_COLOR[tier - 1] });
  burst(x, y, TIER_COLOR[tier - 1], 14, 160);
  for (const e of [...enemies]) {
    if (Math.hypot(e.x - x, e.y - y) <= r + e.r) {
      if (burn) e.burn = { dps: dmg * burn / 3, t: 3 };
      damageEnemy(e, dmg);
    }
  }
}
// 체인 라이트닝: 가장 앞의 적에서 근처 적으로 튕김
function chainLightning(c, first, atk, baseDmg) {
  const pts = [{ x: c.x, y: c.y - 20 }];
  const hit = new Set();
  let cur = first, dmg = baseDmg;
  for (let i = 0; i < atk.chains && cur; i++) {
    // 번개가 지그재그로 보이도록 중간점 추가
    const prev = pts[pts.length - 1];
    for (let k = 1; k <= 3; k++) {
      pts.push({ x: prev.x + (cur.x - prev.x) * k / 4 + (Math.random() - 0.5) * 26, y: prev.y + (cur.y - prev.y) * k / 4 + (Math.random() - 0.5) * 26 });
    }
    pts.push({ x: cur.x, y: cur.y });
    hit.add(cur);
    burst(cur.x, cur.y, "#ffe97a", 8, 120);
    damageEnemy(cur, Math.round(dmg));
    dmg *= 0.72;
    let next = null, nd = 150;
    for (const e of enemies) {
      if (hit.has(e) || e.y < FIELD_TOP - 10) continue;
      const d = Math.hypot(e.x - cur.x, e.y - cur.y);
      if (d < nd) { nd = d; next = e; }
    }
    cur = next;
  }
  effects.push({ type: "bolt", pts, life: 0.16, t: 0, w: atk.chains >= 6 ? 12 : 7 });
}
// 자기 열(레인) 앞의 적만, 방어선에 가까운 순서로 최대 n마리
const LANE_MARGIN = 24; // 레인 폭 여유 (옆 칸 경계에 걸친 적도 커버)
function laneEnemies(col, n) {
  const left = col * CELL - LANE_MARGIN, right = (col + 1) * CELL + LANE_MARGIN;
  return enemies
    .filter(e => e.y > FIELD_TOP - 10 && e.x >= left && e.x <= right)
    .sort((a, b) => b.y - a.y)
    .slice(0, n);
}
// 무기 발사: 종류별로 완전히 다른 공격
function fireWeapon(tier, c, targets) {
  const atk = ATTACK[tier - 1], main = targets[0];
  const dmg = Math.round(atk.dmg * dmgMult()); // ⚔️ 공격력 업그레이드 적용
  sfx.shoot();
  switch (atk.type) {
    case "chain":
      chainLightning(c, main, atk, dmg);
      break;
    case "star": // 별똥별: 하늘에서 낙하 후 폭발
      for (const tg of targets)
        projectiles.push({ kind: "star", x: tg.x + (Math.random() - 0.5) * 80, y: tg.y - 340, tx: tg.x, ty: tg.y, speed: atk.speed, dmg, tier, aoe: atk.aoe, rot: Math.random() * 6 });
      break;
    case "pierce": { // 관통 화살/드래곤 브레스: 직선으로 끝까지
      const dx = main.x - c.x, dy = main.y - (c.y - 20), d = Math.hypot(dx, dy) || 1;
      projectiles.push({ kind: "pierce", x: c.x, y: c.y - 20, vx: dx / d * atk.speed, vy: dy / d * atk.speed, dmg, tier, wide: atk.wide || 0, hitSet: new Set(), rot: Math.atan2(dy, dx) + Math.PI / 2 });
      break;
    }
    case "tornado": // 회오리: 레인 바닥에서 생성돼 위로 쓸고 올라감
      projectiles.push({ kind: "tornado", x: c.x, y: GRID_TOP - 50, dmg, tier, speed: atk.speed, tick: 0, rot: 0 });
      break;
    case "smash": // 골렘 주먹: 가장 앞의 적 머리 위에서 내리찍기
      projectiles.push({ kind: "smash", x: main.x, y: main.y - 320, tx: main.x, ty: main.y, speed: atk.speed, dmg, tier, aoe: atk.aoe, rot: 0 });
      break;
    case "wave": { // 해일: 레인 폭 전체를 쓸어올리는 물의 장벽
      const col = Math.max(0, Math.min(COLS - 1, Math.floor(c.x / CELL)));
      projectiles.push({ kind: "wave", left: col * CELL - LANE_MARGIN, right: (col + 1) * CELL + LANE_MARGIN, y: GRID_TOP - 40, speed: atk.speed, dmg, tier, hitSet: new Set(), wob: 0 });
      break;
    }
    case "eruption": // 화산: 용암탄이 레인의 적들 위로 낙하
      for (const tg of targets)
        projectiles.push({ kind: "star", sub: "lava", x: tg.x + (Math.random() - 0.5) * 60, y: tg.y - 340, tx: tg.x, ty: tg.y, speed: atk.speed, dmg, tier, aoe: atk.aoe, burn: atk.burn, rot: Math.random() * 6 });
      break;
    case "blackhole": // 블랙홀: 도착 지점에서 적을 빨아들이며 연속 피해
      projectiles.push({ kind: "blackhole", x: c.x, y: c.y - 20, tx: main.x, ty: main.y - 20, speed: atk.speed, dmg, tier, phase: 0, life: 1.6, tick: 0, rot: 0 });
      break;
    case "judgment": { // 신의 심판: 레인 전체 즉시 소멸 빔
      const col = Math.max(0, Math.min(COLS - 1, Math.floor(c.x / CELL)));
      const left = col * CELL - LANE_MARGIN, right = (col + 1) * CELL + LANE_MARGIN;
      for (const e of [...enemies])
        if (e.x >= left && e.x <= right && e.y > FIELD_TOP - 30) damageEnemy(e, dmg);
      effects.push({ type: "beam", left, right, life: 0.45, t: 0 });
      shakeT = 0.3;
      sfx.wave();
      break;
    }
    case "boomerang": // 부메랑: 갔다가 돌아오며 경로의 적 모두 타격
      projectiles.push({ kind: "boom", x: c.x, y: c.y - 20, ox: c.x, oy: c.y - 20, tx: main.x, ty: main.y - 30, phase: 0, speed: atk.speed, dmg, tier, hitSet: new Set(), rot: 0 });
      break;
    case "spread": // 삼지창: 서로 다른 적 3마리 동시 공격
      for (const tg of targets)
        projectiles.push({ kind: "homing", sub: "trident", target: tg, x: c.x, y: c.y - 20, speed: atk.speed, dmg, tier, aoe: 0, burn: 0, rot: 0 });
      break;
    default: // basic / dagger / slash / homing / fire
      projectiles.push({ kind: "homing", sub: atk.type, target: main, x: c.x, y: c.y - 20, speed: atk.speed, dmg, tier, aoe: atk.aoe || 0, burn: atk.burn || 0, rot: 0, spin: 0 });
  }
}

function floatText(x, y, txt, color, size, life) {
  floats.push({ x, y, txt, color, size: size || 16, life: life || 0.8, t: 0 });
}
function burst(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (0.3 + Math.random()) * (spd || 120);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: 0.5 + Math.random() * 0.4, t: 0, color, r: 2 + Math.random() * 4 });
  }
}

}
function inBtn(p, b) { return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h; }
function slotAt(p) {
  if (p.y < GRID_TOP || p.y > GRID_TOP + ROWS * (CELL - 8)) return -1;
  const c = Math.floor(p.x / CELL);
  const r = Math.floor((p.y - GRID_TOP) / (CELL - 8));
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return -1;
  return r * COLS + c;
}

function onDown(e) {
  e.preventDefault();
  const p = ptFromEvent(e);
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();

  if (state === "title") { state = "play"; reset(); sfx.wave(); return; }
  if (state === "over")  { state = "title"; return; }

  if (inBtn(p, BTN.sound)) { soundOn = !soundOn; return; }
  if (inBtn(p, BTN.speed)) { timeScale = timeScale === 1 ? 2 : 1; return; }
  for (const sb of SKILL_BTNS) {
    if (Math.hypot(p.x - sb.x, p.y - sb.y) <= sb.r + 8) { useSkill(sb.key); return; }
  }
  if (inBtn(p, BTN.buy)) {
    if (gold >= buyCost()) {
      const t = rollBuyTier();
      if (addUnit(t)) {
        gold -= buyCost(); buyCount++; sfx.buy();
        if (t >= 6) { // 초대박 당첨 연출
          floatText(W / 2, H / 2 - 100, "🎊 초대박! " + t + "등급 " + TIER_NAME[t - 1] + "!! 🎊", "#ffd93d", 30, 2);
          burst(W / 2, H / 2 - 100, TIER_COLOR[t - 1], 50, 260);
          shakeT = 0.3;
          sfx.wave();
        } else if (t >= 3) { // 고등급 당첨 연출
          floatText(BTN.buy.x + BTN.buy.w / 2, BTN.buy.y - 12, "🎉 " + t + "등급 " + TIER_NAME[t - 1] + "!", TIER_COLOR[t - 1], 21, 1.3);
          sfx.merge();
        }
      }
      else { floatText(BTN.buy.x + BTN.buy.w / 2, BTN.buy.y - 10, "칸이 가득 찼어요!", "#ffd93d", 18); sfx.error(); }
    } else { floatText(BTN.buy.x + BTN.buy.w / 2, BTN.buy.y - 10, "골드 부족!", "#ff6b6b", 18); sfx.error(); }
    return;
  }
  // 업그레이드 구매
  for (const b of BTN.upg) {
    if (inBtn(p, b)) {
      const cost = upgCost(b.key);
      if (gold >= cost) {
        gold -= cost; upg[b.key]++;
        sfx.merge();
        burst(b.x + b.w / 2, b.y + b.h / 2, "#7dffb2", 12, 130);
        floatText(b.x + b.w / 2, b.y - 12, b.icon + " " + b.label + " Lv" + upg[b.key], "#7dffb2", 17, 1.1);
      } else { floatText(b.x + b.w / 2, b.y - 12, "골드 부족!", "#ff6b6b", 16); sfx.error(); }
      return;
    }
  }
  const idx = slotAt(p);
  if (idx >= 0 && grid[idx]) drag = { idx, x: p.x, y: p.y };
}
function onMove(e) {
  e.preventDefault();
  if (!drag) return;
  const p = ptFromEvent(e);
  drag.x = p.x; drag.y = p.y;
}
function onUp(e) {
  e.preventDefault();
  if (!drag) return;
  // 🗑️ 판매 존에 놓으면 판매
  if (grid[drag.idx] && Math.hypot(drag.x - TRASH.x, drag.y - TRASH.y) <= TRASH.r + 12) {
    const u = grid[drag.idx];
    const price = sellPrice(u.tier);
    gold += price;
    grid[drag.idx] = null;
    floatText(TRASH.x + 60, TRASH.y, "판매 +" + fmt(price) + "💰", "#ffd93d", 19, 1.1);
    burst(TRASH.x, TRASH.y, TIER_COLOR[u.tier - 1], 14, 140);
    sfx.buy();
    drag = null;
    return;
  }
  const to = slotAt({ x: drag.x, y: drag.y });
  const from = drag.idx;
  if (to >= 0 && to !== from && grid[from]) {
    const a = grid[from], b = grid[to];
    if (!b) { grid[to] = a; grid[from] = null; }                       // 이동
    else if (b.tier === a.tier && a.tier < MAX_TIER) {                 // 합성!
      let nt = a.tier + 1, jackpot = false;
      if (nt < MAX_TIER && Math.random() < 0.12) { nt++; jackpot = true; } // 🎉 12% 확률 2단계 점프
      grid[to] = { tier: nt, cd: 0, pop: 1, recoil: 0 };
      grid[from] = null;
      peakTier = Math.max(peakTier, nt);
      const c = cellCenter(to);
      burst(c.x, c.y, TIER_COLOR[nt - 1], jackpot ? 44 : 24, jackpot ? 240 : 160);
      floatText(c.x, c.y - 40, (jackpot ? "🎉 대박! " : "") + TIER_NAME[nt - 1] + " 획득!", jackpot ? "#ffd93d" : TIER_COLOR[nt - 1], jackpot ? 24 : 20, 1.2);
      sfx.merge();
    } else if (b.tier === a.tier && a.tier >= MAX_TIER) {
      floatText(drag.x, drag.y - 30, "최고 등급!", "#ffd93d", 18); sfx.error();
    } else { grid[to] = a; grid[from] = b; }                           // 교환
  }
  drag = null;
}
canvas.addEventListener("mousedown", onDown);
canvas.addEventListener("mousemove", onMove);
window.addEventListener("mouseup", onUp);
canvas.addEventListener("touchstart", onDown, { passive: false });
canvas.addEventListener("touchmove", onMove, { passive: false });
canvas.addEventListener("touchend", onUp, { passive: false });

function cellCenter(idx) {
  const c = idx % COLS, r = Math.floor(idx / COLS);
  return { x: c * CELL + CELL / 2, y: GRID_TOP + r * (CELL - 8) + (CELL - 8) / 2 };
}

// ---------- 업데이트 ----------
function update(dt) {
  time += dt;
  if (state !== "play") return;

  // 웨이브 진행
  if (!waveActive) {
    waveDelay -= dt;
    if (waveDelay <= 0) startWave();
  } else {
    if (spawnQueue > 0) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnEnemy();
        spawnQueue--;
        spawnTimer = Math.max(0.3, 1.3 - wave * 0.05) * (0.7 + Math.random() * 0.6);
      }
    } else if (enemies.length === 0) {
      waveActive = false;
      waveDelay = 3; // 합성할 여유 시간

      const bonus = Math.floor((30 + wave * 18) * goldMult());
      gold += bonus;
      floatText(W / 2, H / 2 - 80, "웨이브 클리어! +" + bonus + "💰", "#ffd93d", 24, 1.5);
    }
  }

  // 적 이동
  // 스킬 쿨다운
  skills.meteor = Math.max(0, skills.meteor - dt);
  skills.freeze = Math.max(0, skills.freeze - dt);

  // 무기 자동 생성 (빈 칸이 없으면 게이지 꽉 찬 채 대기)
  unitTimer = Math.min(unitTimer + dt, unitInterval());
  if (unitTimer >= unitInterval() && grid.some(s => !s)) {
    const t = rollBuyTier();
    addUnit(t);
    unitTimer = 0;
    sfx.buy();
    if (t >= 6) {
      floatText(W / 2, H / 2 - 100, "🎊 초대박! " + t + "등급 " + TIER_NAME[t - 1] + "!! 🎊", "#ffd93d", 30, 2);
      shakeT = 0.3;
      sfx.wave();
    }
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.frozen > 0) e.frozen -= dt;
    const slow = e.frozen > 0 ? 0.3 : 1; // ❄️ 빙결 시 감속
    e.wob += dt * 4 * slow;
    e.y += e.speed * slow * dt;
    e.x += Math.sin(e.wob) * 12 * dt;
    e.x = Math.max(e.r, Math.min(W - e.r, e.x));
    if (e.hitT > 0) e.hitT -= dt;
    // 화상 지속 피해
    if (e.burn && e.burn.t > 0) {
      e.burn.t -= dt;
      if (Math.random() < dt * 12) particles.push({ x: e.x + (Math.random() - 0.5) * e.r, y: e.y - e.r * 0.5, vx: (Math.random() - 0.5) * 30, vy: -60 - Math.random() * 40, life: 0.4, t: 0, color: Math.random() < 0.5 ? "#ff7b2e" : "#ffd93d", r: 3 + Math.random() * 3 });
      damageEnemy(e, e.burn.dps * dt, true);
      if (enemies.indexOf(e) === -1) continue;
    }
    if (e.y > GRID_TOP - e.r - 20) {   // 방어선 도달
      enemies.splice(i, 1);
      lives -= e.boss ? 3 : 1;
      shakeT = 0.35; flashT = 0.3;
      sfx.hurt();
      burst(e.x, GRID_TOP - 30, "#ff5555", 18, 150);
      if (lives <= 0) {
        lives = 0;
        state = "over";
        if (wave > best) { best = wave; localStorage.setItem("smd_best", best); }
      }
    }
  }

  // 유닛 공격
  for (let i = 0; i < grid.length; i++) {
    const u = grid[i];
    if (!u) continue;
    if (u.pop > 0) u.pop -= dt * 3;
    if (u.recoil > 0) u.recoil -= dt * 6;
    u.cd -= dt;
    if (u.cd <= 0 && enemies.length) {
      const atk = ATTACK[u.tier - 1];
      const targets = laneEnemies(i % COLS, atk.count || 1); // 자기 열 앞의 적만
      if (targets.length) {
        fireWeapon(u.tier, cellCenter(i), targets);
        u.cd = 1 / (atk.rate * rateMult()); // ⏩ 공속 업그레이드 적용
        u.recoil = 1;
      }
    }
  }

  // 투사체 (무기 종류별로 다르게 움직임)
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    let remove = false;

    if (p.kind === "homing") {
      // 유도형: basic / dagger / trident / slash / homing / fire
      const t = p.target;
      if (!t || t.hp <= 0 || enemies.indexOf(t) === -1) { remove = true; }
      else {
        const dx = t.x - p.x, dy = t.y - p.y, d = Math.hypot(dx, dy) || 1;
        p.rot = Math.atan2(dy, dx) + Math.PI / 2;
        if (p.sub === "slash") p.spin += dt * 18;
        // 마법탄/화염은 꼬리 파티클
        if ((p.sub === "homing" || p.sub === "fire") && Math.random() < dt * 40)
          particles.push({ x: p.x, y: p.y, vx: (Math.random() - 0.5) * 40, vy: (Math.random() - 0.5) * 40, life: 0.3, t: 0, color: p.sub === "fire" ? "#ff9b4f" : "#d9a0ff", r: 3 });
        if (d < t.r + 10) {
          if (p.aoe) aoeDamage(t.x, t.y, p.aoe, p.dmg, p.tier, p.burn);
          else { damageEnemy(t, p.dmg); burst(p.x, p.y, TIER_COLOR[p.tier - 1], 5, 90); }
          sfx.hit();
          remove = true;
        } else { p.x += dx / d * p.speed * dt; p.y += dy / d * p.speed * dt; }
      }
    } else if (p.kind === "pierce") {
      // 관통 화살/브레스: 직선 이동, 스치는 모든 적 타격
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.wide && Math.random() < dt * 30)
        particles.push({ x: p.x + (Math.random() - 0.5) * 40, y: p.y, vx: (Math.random() - 0.5) * 60, vy: 40, life: 0.35, t: 0, color: "#3dd96b", r: 4 });
      for (const e of [...enemies]) {
        if (!p.hitSet.has(e) && Math.hypot(e.x - p.x, e.y - p.y) < e.r + 10 + (p.wide || 0)) {
          p.hitSet.add(e);
          damageEnemy(e, p.dmg);
          burst(p.x, p.y, TIER_COLOR[p.tier - 1], 4, 80);
          sfx.hit();
        }
      }
      if (p.y < FIELD_TOP - 60 || p.x < -40 || p.x > W + 40 || p.y > H + 40) remove = true;
    } else if (p.kind === "tornado") {
      // 회오리: 위로 이동하며 범위 내 적 연속 타격 + 중심으로 끌어당김
      p.y -= p.speed * dt;
      p.rot += dt * 12;
      p.tick += dt;
      for (const e of enemies) {
        const d = Math.hypot(e.x - p.x, e.y - p.y);
        if (d < 80) e.x += (p.x - e.x) * 1.5 * dt; // 흡입
      }
      if (p.tick >= 0.22) {
        p.tick = 0;
        for (const e of [...enemies])
          if (Math.hypot(e.x - p.x, e.y - p.y) < 48 + e.r * 0.5) { damageEnemy(e, p.dmg); }
        burst(p.x, p.y, TIER_COLOR[p.tier - 1], 3, 70);
      }
      if (p.y < FIELD_TOP - 40) remove = true;
    } else if (p.kind === "smash") {
      // 골렘 주먹: 목표 지점으로 낙하 후 충격파
      const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy);
      if (d < 20) {
        aoeDamage(p.tx, p.ty, p.aoe, p.dmg, p.tier);
        shakeT = Math.max(shakeT, 0.2);
        sfx.hurt();
        remove = true;
      } else { p.x += dx / d * p.speed * dt; p.y += dy / d * p.speed * dt; }
    } else if (p.kind === "wave") {
      // 해일: 레인 폭 전체로 쓸어올림, 닿은 적 모두 1회 타격
      p.y -= p.speed * dt;
      p.wob += dt * 10;
      for (const e of [...enemies]) {
        if (!p.hitSet.has(e) && e.x >= p.left - e.r && e.x <= p.right + e.r && Math.abs(e.y - p.y) < 30 + e.r) {
          p.hitSet.add(e);
          damageEnemy(e, p.dmg);
          burst(e.x, p.y, "#7ec8ff", 8, 120);
          sfx.hit();
        }
      }
      if (p.y < FIELD_TOP - 40) remove = true;
    } else if (p.kind === "blackhole") {
      p.rot += dt * 6;
      if (p.phase === 0) {
        // 이동 단계
        const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy);
        if (d < 14) p.phase = 1;
        else { p.x += dx / d * p.speed * dt; p.y += dy / d * p.speed * dt; }
      } else {
        // 흡입 단계: 주변 적을 빨아들이며 0.2초마다 피해
        p.life -= dt;
        p.tick += dt;
        for (const e of enemies) {
          const d = Math.hypot(e.x - p.x, e.y - p.y);
          if (d < 130) {
            e.x += (p.x - e.x) * 2.2 * dt;
            e.y += (p.y - e.y) * 1.2 * dt;
          }
        }
        if (p.tick >= 0.2) {
          p.tick = 0;
          for (const e of [...enemies])
            if (Math.hypot(e.x - p.x, e.y - p.y) < 115) damageEnemy(e, p.dmg);
        }
        if (p.life <= 0) {
          burst(p.x, p.y, "#7b5cff", 30, 240);
          effects.push({ type: "ring", x: p.x, y: p.y, maxR: 130, life: 0.3, t: 0, color: "#7b5cff" });
          sfx.kill();
          remove = true;
        }
      }
    } else if (p.kind === "boom") {
      // 부메랑: 목표 지점까지 갔다가 되돌아옴, 경로의 적 모두 타격
      p.rot += dt * 16;
      const tx = p.phase === 0 ? p.tx : p.ox, ty = p.phase === 0 ? p.ty : p.oy;
      const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
      if (d < 16) {
        if (p.phase === 0) { p.phase = 1; p.hitSet.clear(); } // 돌아올 때 다시 타격 가능
        else remove = true;
      } else { p.x += dx / d * p.speed * dt; p.y += dy / d * p.speed * dt; }
      for (const e of [...enemies]) {
        if (!p.hitSet.has(e) && Math.hypot(e.x - p.x, e.y - p.y) < e.r + 16) {
          p.hitSet.add(e);
          damageEnemy(e, p.dmg);
          sfx.hit();
        }
      }
    } else if (p.kind === "star") {
      // 별똥별: 낙하 후 범위 폭발
      p.rot += dt * 8;
      if (Math.random() < dt * 30)
        particles.push({ x: p.x, y: p.y, vx: (Math.random() - 0.5) * 30, vy: -40, life: 0.35, t: 0, color: "#ffe97a", r: 3 });
      const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy);
      if (d < 18) { aoeDamage(p.tx, p.ty, p.aoe, p.dmg, p.tier, p.burn || 0); sfx.hit(); remove = true; }
      else { p.x += dx / d * p.speed * dt; p.y += dy / d * p.speed * dt; }
    }

    if (remove) projectiles.splice(i, 1);
  }

  // 지속 이펙트 (폭발 링, 번개)
  for (let i = effects.length - 1; i >= 0; i--) {
    effects[i].t += dt;
    if (effects[i].t > effects[i].life) effects.splice(i, 1);
  }

  // 파티클 & 텍스트
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt;
    if (p.t > p.life) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt;
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.t += dt;
    if (f.t > f.life) floats.splice(i, 1);
  }
  if (shakeT > 0) shakeT -= dt;
  if (flashT > 0) flashT -= dt;
}

// ---------- 그리기 ----------
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function outlinedText(txt, x, y, size, fill, stroke, lw) {
  ctx.font = "900 " + size + "px 'Segoe UI', 'Malgun Gothic', sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineJoin = "round";
  ctx.strokeStyle = stroke || "rgba(60,70,20,0.9)";
  ctx.lineWidth = lw || Math.max(3, size / 5);
  ctx.strokeText(txt, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(txt, x, y);
}

function drawField() {
  // 잔디 배경 (체크무늬)
  ctx.fillStyle = "#a8cc3e";
  ctx.fillRect(0, 0, W, GRID_TOP);
  const cs = 60;
  ctx.fillStyle = "rgba(255,255,255,0.06)";
  for (let y = 0; y < GRID_TOP / cs + 1; y++)
    for (let x = 0; x < W / cs; x++)
      if ((x + y) % 2 === 0) ctx.fillRect(x * cs, y * cs, cs, Math.min(cs, GRID_TOP - y * cs));
  // 양옆 진한 잔디 길 표현
  ctx.fillStyle = "#8db32e";
  ctx.fillRect(0, 0, 26, GRID_TOP);
  ctx.fillRect(W - 26, 0, 26, GRID_TOP);
  // 드래그 중인 무기의 담당 레인 표시
  if (drag && grid[drag.idx]) {
    const col = Math.max(0, Math.min(COLS - 1, Math.floor(drag.x / CELL)));
    ctx.fillStyle = "rgba(255,255,255,0.14)";
    ctx.fillRect(col * CELL, FIELD_TOP, CELL, GRID_TOP - FIELD_TOP);
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 2;
    ctx.strokeRect(col * CELL + 1, FIELD_TOP, CELL - 2, GRID_TOP - FIELD_TOP);
  }
  // 방어선
  const ly = GRID_TOP - 14;
  ctx.strokeStyle = "rgba(255,80,80,0.55)";
  ctx.lineWidth = 4;
  ctx.setLineDash([14, 10]);
  ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(W, ly); ctx.stroke();
  ctx.setLineDash([]);
}

function drawEnemy(e) {
  const squish = 1 + Math.sin(e.wob * 2) * 0.06;
  ctx.save();
  ctx.translate(e.x, e.y);
  // 그림자
  ctx.fillStyle = "rgba(0,0,0,0.15)";
  ctx.beginPath(); ctx.ellipse(0, e.r * 0.85, e.r * 0.9, e.r * 0.3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.scale(squish, 2 - squish);
  // 몸통 (노란 블롭, 빙결 시 하늘색, 탱커는 카키색)
  const bodyCol = e.hitT > 0 ? "#fff" : (e.frozen > 0 ? "#b8dcf0" : e.boss ? "#e8d44f" : e.tank ? "#c9bd7a" : "#d9d06a");
  ctx.fillStyle = bodyCol;
  ctx.beginPath();
  ctx.moveTo(-e.r, e.r * 0.8);
  ctx.bezierCurveTo(-e.r * 1.15, -e.r * 0.6, -e.r * 0.5, -e.r, 0, -e.r);
  ctx.bezierCurveTo(e.r * 0.5, -e.r, e.r * 1.15, -e.r * 0.6, e.r, e.r * 0.8);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(120,110,40,0.5)"; ctx.lineWidth = 2; ctx.stroke();
  // 가시
  ctx.fillStyle = bodyCol;
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo(i * e.r * 0.35 - 4, -e.r * 0.55);
    ctx.lineTo(i * e.r * 0.35, -e.r * 1.05);
    ctx.lineTo(i * e.r * 0.35 + 4, -e.r * 0.55);
    ctx.fill();
  }
  // 얼굴
  ctx.fillStyle = "#5a4a1a";
  ctx.beginPath(); ctx.arc(-e.r * 0.3, 0, e.r * 0.08, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(e.r * 0.3, 0, e.r * 0.08, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#5a4a1a"; ctx.lineWidth = Math.max(2, e.r * 0.07);
  ctx.beginPath(); ctx.arc(0, e.r * 0.15, e.r * 0.25, 0.2, Math.PI - 0.2); ctx.stroke();
  // 머리 위 꽃
  const fy = -e.r * 1.1;
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * Math.PI * 2 + e.wob * 0.3;
    ctx.fillStyle = e.flower;
    ctx.beginPath();
    ctx.ellipse(Math.cos(a) * e.r * 0.28, fy + Math.sin(a) * e.r * 0.28, e.r * 0.18, e.r * 0.12, a, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = "#e84f6b";
  ctx.beginPath(); ctx.arc(0, fy, e.r * 0.13, 0, Math.PI * 2); ctx.fill();
  if (e.boss) outlinedText("👑", 0, -e.r * 1.5, e.r * 0.6, "#fff");
  ctx.restore();
  // HP 숫자 (전장에 들어온 뒤에만 표시)
  const ty = e.y - e.r * (e.boss ? 1.9 : 1.75);
  if (isFinite(e.hp) && ty > 76) outlinedText(fmt(e.hp), e.x, ty, e.boss ? 34 : 24, "#fff");
}

// ---------- 무기별 투사체 그리기 ----------
function star5(r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 === 0 ? r : r * 0.45;
    if (i === 0) ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
    else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath();
}
function drawProjectile(p) {
  const col = TIER_COLOR[p.tier - 1];
  if (p.kind === "wave") { // 해일: 레인 폭 물의 장벽 (좌표계가 달라 별도 처리)
    ctx.save();
    ctx.fillStyle = "rgba(61,155,255,0.55)";
    ctx.beginPath();
    ctx.moveTo(p.left, p.y + 24);
    for (let x = p.left; x <= p.right; x += 12)
      ctx.lineTo(x, p.y + Math.sin(x * 0.15 + p.wob) * 6 - 8);
    ctx.lineTo(p.right, p.y + 24);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#cde9ff"; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let x = p.left; x <= p.right; x += 12) {
      const yy = p.y + Math.sin(x * 0.15 + p.wob) * 6 - 8;
      x === p.left ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
    }
    ctx.stroke();
    ctx.restore();
    return;
  }
  ctx.save();
  ctx.translate(p.x, p.y);
  const sub = p.sub || p.kind;

  if (sub === "dagger") {                      // 단검: 빠른 은빛 찌르기
    ctx.rotate(p.rot);
    ctx.fillStyle = "#e8e8f0";
    ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(3.5, 4); ctx.lineTo(-3.5, 4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = col; ctx.fillRect(-4.5, 4, 9, 4);
  } else if (p.kind === "pierce" && p.wide) {  // 드래곤 브레스: 거대한 용
    ctx.rotate(p.rot);
    const g = ctx.createRadialGradient(0, 0, 4, 0, 0, 40);
    g.addColorStop(0, "#b8ffcf"); g.addColorStop(0.5, "#3dd96b"); g.addColorStop(1, "rgba(61,217,107,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI * 2); ctx.fill();
    ctx.font = "44px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("🐉", 0, 0);
  } else if (p.kind === "pierce") {            // 관통 화살
    ctx.rotate(p.rot);
    ctx.strokeStyle = "#b07840"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 18); ctx.lineTo(0, -12); ctx.stroke();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(6, -8); ctx.lineTo(-6, -8); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-5, 18); ctx.lineTo(0, 12); ctx.lineTo(5, 18); ctx.stroke();
  } else if (p.kind === "boom") {              // 회전 부메랑
    ctx.rotate(p.rot);
    ctx.strokeStyle = col; ctx.lineWidth = 8; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-14, 6); ctx.lineTo(0, -8); ctx.lineTo(14, 6); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-14, 6); ctx.lineTo(0, -8); ctx.lineTo(14, 6); ctx.stroke();
  } else if (sub === "trident") {              // 삼지창: 세 갈래 창
    ctx.rotate(p.rot);
    ctx.fillStyle = col;
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath(); ctx.moveTo(k * 7, -14); ctx.lineTo(k * 7 + 3, -2); ctx.lineTo(k * 7 - 3, -2); ctx.closePath(); ctx.fill();
    }
    ctx.fillRect(-8, -3, 16, 3);
    ctx.fillRect(-1.5, -3, 3, 14);
  } else if (sub === "slash") {                // 대검: 빙글빙글 도는 큰 검
    ctx.rotate(p.spin || 0);
    ctx.fillStyle = "#dfe4ee";
    ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(6, -4); ctx.lineTo(6, 8); ctx.lineTo(-6, 8); ctx.lineTo(-6, -4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = col; ctx.fillRect(-11, 8, 22, 5);
    ctx.fillRect(-2.5, 13, 5, 8);
    ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 1.4); ctx.stroke();
  } else if (sub === "homing") {               // 마법탄: 빛나는 구슬
    const g = ctx.createRadialGradient(0, 0, 1, 0, 0, 12);
    g.addColorStop(0, "#fff"); g.addColorStop(0.4, "#e0b0ff"); g.addColorStop(1, "rgba(176,79,217,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
  } else if (sub === "fire") {                 // 화염구
    const g = ctx.createRadialGradient(0, 0, 1, 0, 0, 14);
    g.addColorStop(0, "#fff3b0"); g.addColorStop(0.4, "#ff9b4f"); g.addColorStop(1, "rgba(255,80,30,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffd93d";
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
  } else if (p.kind === "star") {              // 별똥별 / 용암탄
    ctx.rotate(p.rot);
    if (p.sub === "lava") {
      const g = ctx.createRadialGradient(0, 0, 1, 0, 0, 16);
      g.addColorStop(0, "#fff3b0"); g.addColorStop(0.45, "#ff5a2e"); g.addColorStop(1, "rgba(160,30,10,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#7a2e10";
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(Math.cos(i * 2.1) * 6, Math.sin(i * 2.1) * 6, 2.5, 0, Math.PI * 2); ctx.fill(); }
    } else {
      ctx.fillStyle = p.tier >= 11 ? TIER_COLOR[p.tier - 1] : "#ffe97a"; star5(14); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; star5(14); ctx.stroke();
    }
  } else if (p.kind === "tornado") {           // 회오리: 회전하는 소용돌이
    ctx.rotate(p.rot);
    for (let i = 3; i >= 1; i--) {
      ctx.strokeStyle = i % 2 ? "#7ee0c3" : "#b8f0e0";
      ctx.lineWidth = 5;
      ctx.globalAlpha = 0.85;
      ctx.beginPath(); ctx.arc(0, 0, i * 13, i, i + Math.PI * 1.3); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  } else if (p.kind === "smash") {             // 골렘 주먹: 낙하하는 돌주먹
    ctx.rotate(0.15);
    roundRect(-20, -22, 40, 44, 10);
    ctx.fillStyle = "#a58b6f"; ctx.fill();
    ctx.strokeStyle = "#6e5a45"; ctx.lineWidth = 3; ctx.stroke();
    for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(i * 11, -14, 5, Math.PI, 0); ctx.fillStyle = "#8a7256"; ctx.fill(); }
  } else if (p.kind === "blackhole") {         // 블랙홀: 소용돌이치는 어둠
    ctx.rotate(p.rot);
    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 26);
    g.addColorStop(0, "#000"); g.addColorStop(0.6, "#3a2a6e"); g.addColorStop(1, "rgba(123,92,255,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#b8a0ff"; ctx.lineWidth = 2.5;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.arc(0, 0, 14 + i * 5, i * 2.1, i * 2.1 + Math.PI); ctx.stroke();
    }
  } else {                                     // 기본 (곡괭이)
    ctx.rotate(p.rot);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(5, 8); ctx.lineTo(-5, 8); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 1.5; ctx.stroke();
  }
  ctx.restore();
}
function drawEffect(fx) {
  const k = fx.t / fx.life;
  if (fx.type === "ring") {
    ctx.globalAlpha = 1 - k;
    ctx.strokeStyle = fx.color; ctx.lineWidth = 6 * (1 - k) + 2;
    ctx.beginPath(); ctx.arc(fx.x, fx.y, fx.maxR * (0.3 + k * 0.7), 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = (1 - k) * 0.25;
    ctx.fillStyle = fx.color;
    ctx.beginPath(); ctx.arc(fx.x, fx.y, fx.maxR * (0.3 + k * 0.7), 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (fx.type === "bolt") {
    ctx.globalAlpha = 1 - k;
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.strokeStyle = "#ffe97a"; ctx.lineWidth = fx.w || 7;
    ctx.beginPath();
    fx.pts.forEach((pt, i) => i === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y));
    ctx.stroke();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = (fx.w || 7) * 0.35;
    ctx.stroke();
    ctx.globalAlpha = 1;
  } else if (fx.type === "beam") { // 신의 심판: 레인 전체 무지개 빔
    ctx.globalAlpha = (1 - k) * 0.85;
    const g = ctx.createLinearGradient(fx.left, 0, fx.right, 0);
    g.addColorStop(0, "rgba(255,155,224,0)");
    g.addColorStop(0.2, "#ff9be0"); g.addColorStop(0.4, "#ffe97a");
    g.addColorStop(0.6, "#7dffb2"); g.addColorStop(0.8, "#9ad8ff");
    g.addColorStop(1, "rgba(154,216,255,0)");
    ctx.fillStyle = g;
    ctx.fillRect(fx.left, FIELD_TOP, fx.right - fx.left, GRID_TOP - FIELD_TOP);
    ctx.globalAlpha = 1 - k;
    ctx.fillStyle = "#fff";
    ctx.fillRect((fx.left + fx.right) / 2 - 10 * (1 - k), FIELD_TOP, 20 * (1 - k), GRID_TOP - FIELD_TOP);
    ctx.globalAlpha = 1;
  }
}

function drawUnit(x, y, tier, scale, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.globalAlpha = alpha;
  roundRect(-34, -34, 68, 68, 14);
  ctx.fillStyle = TIER_COLOR[tier - 1];
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.25)"; ctx.lineWidth = 3; ctx.stroke();
  roundRect(-34, -34, 68, 30, 14);
  ctx.fillStyle = "rgba(255,255,255,0.22)"; ctx.fill();
  ctx.font = "38px serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(TIER_EMOJI[tier - 1], 0, -2);
  // 등급 뱃지
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  roundRect(8, 14, 26, 20, 8); ctx.fill();
  ctx.fillStyle = "#ffd93d";
  ctx.font = "900 15px sans-serif";
  ctx.fillText(tier, 21, 24);
  ctx.restore();
}

function drawGrid() {
  // 나무 판 배경
  ctx.fillStyle = "#c98a3d";
  ctx.fillRect(0, GRID_TOP - 8, W, H - GRID_TOP + 8);
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = c * CELL + 4, y = GRID_TOP + r * (CELL - 8) + 2;
      roundRect(x, y, CELL - 8, CELL - 12, 10);
      ctx.fillStyle = (r + c) % 2 === 0 ? "#e0a955" : "#d69c48";
      ctx.fill();
    }
  }
  // 유닛
  for (let i = 0; i < grid.length; i++) {
    const u = grid[i];
    if (!u) continue;
    if (drag && drag.idx === i) continue;
    const c = cellCenter(i);
    const s = 1 + Math.max(0, u.pop) * 0.25;
    drawUnit(c.x, c.y - Math.max(0, u.recoil) * 5, u.tier, s, 1);
  }
  // 드래그 중 유닛
  if (drag && grid[drag.idx]) {
    const u = grid[drag.idx];
    // 🗑️ 판매 존 표시
    const overTrash = Math.hypot(drag.x - TRASH.x, drag.y - TRASH.y) <= TRASH.r + 12;
    ctx.beginPath(); ctx.arc(TRASH.x, TRASH.y, TRASH.r + (overTrash ? 6 : 0), 0, Math.PI * 2);
    ctx.fillStyle = overTrash ? "rgba(220,60,60,0.85)" : "rgba(40,40,40,0.65)";
    ctx.fill();
    ctx.strokeStyle = overTrash ? "#fff" : "rgba(255,255,255,0.4)";
    ctx.lineWidth = 3; ctx.stroke();
    ctx.font = "26px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("🗑️", TRASH.x, TRASH.y - 6);
    outlinedText("+" + fmt(sellPrice(u.tier)), TRASH.x, TRASH.y + 18, 13, "#ffd93d", "rgba(0,0,0,0.6)", 3);
    const to = slotAt({ x: drag.x, y: drag.y });
    // 합성 가능 하이라이트
    if (to >= 0 && to !== drag.idx && grid[to] && grid[to].tier === u.tier && u.tier < MAX_TIER) {
      const c = cellCenter(to);
      ctx.strokeStyle = "#ffd93d"; ctx.lineWidth = 5;
      roundRect(c.x - 42, c.y - 42, 84, 84, 14); ctx.stroke();
    }
    drawUnit(drag.x, drag.y - 12, u.tier, 1.15, 0.9);
  }
}

function drawHUD() {
  // 상단 바
  ctx.fillStyle = "rgba(40,55,20,0.85)";
  ctx.fillRect(0, 0, W, 60);
  outlinedText("💰 " + gold, 70, 30, 22, "#ffd93d", "rgba(0,0,0,0.6)", 4);
  outlinedText("❤️ " + lives, 190, 30, 22, "#ff8f8f", "rgba(0,0,0,0.6)", 4);
  outlinedText("웨이브 " + Math.max(wave, 1) + (wave > 0 && wave % 5 === 0 ? " 👑" : ""), 320, 30, 22, "#fff", "rgba(0,0,0,0.6)", 4);
  // 사운드 & 배속 버튼
  ctx.font = "26px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(soundOn ? "🔊" : "🔇", BTN.sound.x + 21, BTN.sound.y + 21);
  roundRect(BTN.speed.x, BTN.speed.y + 4, BTN.speed.w, BTN.speed.h - 8, 10);
  ctx.fillStyle = timeScale === 2 ? "#ffd93d" : "rgba(255,255,255,0.2)";
  ctx.fill();
  outlinedText(timeScale + "x", BTN.speed.x + 21, BTN.speed.y + 21, 19, timeScale === 2 ? "#5a4a10" : "#fff", "rgba(0,0,0,0.4)", 3);

  // 스킬 버튼 (쿨다운 표시)
  for (const sb of SKILL_BTNS) {
    const cd = skills[sb.key], ready = cd <= 0;
    ctx.beginPath(); ctx.arc(sb.x, sb.y, sb.r, 0, Math.PI * 2);
    ctx.fillStyle = ready ? "rgba(40,55,20,0.85)" : "rgba(40,40,40,0.7)";
    ctx.fill();
    ctx.strokeStyle = ready ? "#ffd93d" : "rgba(255,255,255,0.3)";
    ctx.lineWidth = 3; ctx.stroke();
    ctx.globalAlpha = ready ? 1 : 0.45;
    ctx.font = "26px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(sb.icon, sb.x, sb.y + 1);
    ctx.globalAlpha = 1;
    if (!ready) { // 쿨다운 파이 + 남은 초
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.beginPath();
      ctx.moveTo(sb.x, sb.y);
      ctx.arc(sb.x, sb.y, sb.r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (cd / sb.max));
      ctx.closePath(); ctx.fill();
      outlinedText(Math.ceil(cd), sb.x, sb.y, 20, "#fff");
    } else if (state === "play") { // 사용 가능 반짝임
      ctx.globalAlpha = 0.4 + Math.sin(time * 5) * 0.3;
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sb.x, sb.y, sb.r + 4, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // 구매 버튼
  const b = BTN.buy, afford = gold >= buyCost();
  roundRect(b.x, b.y, b.w, b.h, 14);
  ctx.fillStyle = afford ? "#8e44d9" : "#777";
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.3)"; ctx.lineWidth = 3; ctx.stroke();
  outlinedText("즉시 뽑기 💰" + buyCost(), b.x + b.w / 2, b.y + b.h / 2, 19, "#fff", "rgba(0,0,0,0.5)", 4);

  // 다음 무기 자동 생성 게이지
  const gy = GRID_TOP - 80, full = grid.every(s => s);
  roundRect(12, gy, W - 24, 9, 5);
  ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.fill();
  const prog = Math.min(1, unitTimer / unitInterval());
  if (prog > 0.03) {
    roundRect(12, gy, (W - 24) * prog, 9, 5);
    ctx.fillStyle = full ? "#999" : "#7dffb2"; ctx.fill();
  }
  outlinedText(full ? "칸이 가득 참! 합성하세요" : "다음 무기 자동 생성 중...", W / 2, gy - 12, 15, full ? "#ffd93d" : "#fff", "rgba(0,0,0,0.5)", 3);

  // 업그레이드 버튼 3종
  for (const ub of BTN.upg) {
    const cost = upgCost(ub.key), ok = gold >= cost;
    roundRect(ub.x, ub.y, ub.w, ub.h, 12);
    ctx.fillStyle = ok ? "#2f9e6e" : "#6b6b6b";
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.3)"; ctx.lineWidth = 3; ctx.stroke();
    outlinedText(ub.icon + ub.pct, ub.x + ub.w / 2, ub.y + 15, 14, "#fff", "rgba(0,0,0,0.5)", 3);
    outlinedText("💰" + cost, ub.x + ub.w / 2, ub.y + 39, 14, "#ffd93d", "rgba(0,0,0,0.5)", 3);
    // 레벨 뱃지
    if (upg[ub.key] > 0) {
      ctx.fillStyle = "#ffd93d";
      roundRect(ub.x + ub.w - 26, ub.y - 8, 30, 18, 8); ctx.fill();
      ctx.fillStyle = "#5a4a10";
      ctx.font = "900 12px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("Lv" + upg[ub.key], ub.x + ub.w - 11, ub.y + 1);
    }
  }

  // 다음 웨이브 안내
  if (!waveActive && state === "play") {
    outlinedText("다음 웨이브까지 " + Math.ceil(waveDelay) + "초", W / 2, FIELD_TOP + 40, 22, "#fff");
  }
  // 조작 안내 (첫 웨이브 동안)
  if (wave <= 1) {
    outlinedText("같은 무기를 드래그해서 합치세요!", W / 2 - 30, GRID_TOP - 154, 20, "#fff");
    outlinedText("무기는 자기 세로줄 앞의 적만 공격해요!", W / 2 - 30, GRID_TOP - 126, 18, "#ffd93d");
  }
}

function drawTitle() {
  ctx.fillStyle = "#a8cc3e";
  ctx.fillRect(0, 0, W, H);
  const cs = 60;
  ctx.fillStyle = "rgba(255,255,255,0.07)";
  for (let y = 0; y < H / cs; y++)
    for (let x = 0; x < W / cs; x++)
      if ((x + y) % 2 === 0) ctx.fillRect(x * cs, y * cs, cs, cs);
  // 떠다니는 슬라임 장식 (hp: NaN → HP 숫자 미표시)
  for (let i = 0; i < 3; i++) {
    drawEnemy({ x: 100 + i * 140, y: 190 + Math.sin(time * 1.5 + i * 2) * 12, r: 34, wob: time * 3 + i, hitT: 0, boss: false, flower: i === 1 ? "#ffb7d5" : "#fff", hp: NaN, maxHp: 1, speed: 0 });
  }
  outlinedText("슬라임", W / 2, 330, 64, "#fff", "rgba(60,80,20,0.9)", 12);
  outlinedText("머지 디펜스", W / 2, 400, 64, "#ffd93d", "rgba(60,80,20,0.9)", 12);
  drawUnit(W / 2 - 90, 500, 1, 1, 1);
  outlinedText("+", W / 2 - 45, 500, 30, "#fff");
  drawUnit(W / 2, 500, 1, 1, 1);
  outlinedText("=", W / 2 + 45, 500, 30, "#fff");
  drawUnit(W / 2 + 90, 500, 2, 1.1, 1);
  const pulse = 1 + Math.sin(time * 4) * 0.05;
  outlinedText("화면을 터치해서 시작!", W / 2, 620 + Math.sin(time * 4) * 3, 28 * pulse, "#fff");
  if (best > 0) outlinedText("🏆 최고 기록: 웨이브 " + best, W / 2, 700, 22, "#ffd93d");
}
function drawOver() {
  ctx.fillStyle = "rgba(20,25,10,0.82)";
  ctx.fillRect(0, 0, W, H);
  outlinedText("게임 오버", W / 2, 300, 56, "#ff6b6b", "rgba(0,0,0,0.8)", 10);
  outlinedText("도달 웨이브: " + wave, W / 2, 390, 30, "#fff");
  outlinedText("처치한 슬라임: " + kills + "마리", W / 2, 440, 24, "#fff");
  if (wave >= best && best > 0) outlinedText("🏆 신기록!", W / 2, 500, 28, "#ffd93d");
  else if (best > 0) outlinedText("최고 기록: 웨이브 " + best, W / 2, 500, 22, "#ffd93d");
  outlinedText("화면을 터치해서 다시 시작", W / 2, 590 + Math.sin(time * 4) * 3, 24, "#fff");
}

function draw() {
  ctx.save();
  if (shakeT > 0) ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);

  if (state === "title") { drawTitle(); ctx.restore(); return; }

  drawField();
  // 적 (아래쪽이 위에 그려지도록 정렬)
  const sorted = [...enemies].sort((a, b) => a.y - b.y);
  for (const e of sorted) drawEnemy(e);
  // 투사체
  for (const p of projectiles) drawProjectile(p);
  // 파티클
  for (const p of particles) {
    ctx.globalAlpha = 1 - p.t / p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 폭발 링 & 번개
  for (const fx of effects) drawEffect(fx);

  drawGrid();
  drawHUD();

  // 떠오르는 텍스트
  for (const f of floats) {
    const k = f.t / f.life;
    ctx.globalAlpha = 1 - k * k;
    outlinedText(f.txt, f.x, f.y - k * 46, f.size, f.color);
    ctx.globalAlpha = 1;
  }

  // 피격 플래시
  if (flashT > 0) {
    ctx.fillStyle = "rgba(255,50,50," + flashT * 0.5 + ")";
    ctx.fillRect(0, 0, W, H);
  }

  if (state === "over") drawOver();
  ctx.restore();
}

// ---------- 메인 루프 ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt * timeScale); // ⏩ 배속 적용
  draw();
  requestAnimationFrame(loop);
}
reset();
state = "title";
requestAnimationFrame(loop);
</script>
</body>
